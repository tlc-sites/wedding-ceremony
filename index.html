/* ── 새로 더한 기능: 개인정보 동의 ── */
.consent-box { margin: 22px 0 6px; padding: 16px 18px; background: var(--soft); border: 1px solid var(--line); border-radius: 14px; }
.consent-check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.consent-check input { flex: none; width: 22px; height: 22px; margin-top: 3px; accent-color: var(--green); }
.consent-check strong { display: block; font-size: 1rem; }
.consent-check strong em { font-style: normal; color: var(--danger); font-weight: 700; }
.consent-check small { display: block; margin-top: 6px; white-space: pre-line; color: var(--muted); font-size: 0.92rem; line-height: 1.7; }

/* ── 새로 더한 기능: 관리자 신청 목록 ── */
.project-list-open { white-space: nowrap; }
.project-drawer { width: min(620px, 100vw); }
.project-list-help { margin: 0 0 14px; color: var(--muted); font-size: 0.95rem; line-height: 1.7; }
.project-list-tools { display: grid; gap: 10px; margin-bottom: 16px; }
.project-list-tools input[type="search"] { width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; font-size: 1rem; background: #fff; }
.project-demo-toggle { display: flex; align-items: center; justify-content: flex-start; gap: 8px; color: var(--muted); font-size: 0.95rem; cursor: pointer; }
.project-demo-toggle input { flex: none; width: 20px !important; height: 20px; min-height: 0 !important; margin: 0; padding: 0; accent-color: var(--green); }
.project-list-links { display: flex; gap: 8px; flex-wrap: wrap; }
.project-list-links .secondary-btn { text-decoration: none; display: inline-flex; align-items: center; }
.project-list { display: grid; gap: 12px; }
.project-item { border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: var(--paper); }
.project-item-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.project-item-head small { display: block; color: var(--muted); font-size: 0.82rem; }
.project-item-head strong { display: block; font-size: 1.12rem; line-height: 1.4; }
.project-badge { flex: none; border-radius: 999px; padding: 5px 11px; background: var(--gold-soft); color: #8a5a17; font-size: 0.85rem; font-weight: 800; white-space: nowrap; }
.project-badge.is-demo { background: #eee; color: #666; }
.project-item dl { display: grid; gap: 4px; margin: 12px 0 0; }
.project-item dl div { display: grid; grid-template-columns: 92px 1fr; gap: 8px; font-size: 0.95rem; }
.project-item dt { color: var(--muted); }
.project-item dd { margin: 0; word-break: break-all; }
.project-item-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.project-item-actions button { min-height: 46px; font-size: 0.98rem; }
.project-item-actions .danger-text { color: var(--danger); }
@media (min-width: 560px) { .project-item-actions { grid-template-columns: repeat(4, auto); justify-content: start; } }

</style>

    if (path === '/api/site-content' && method === 'PUT') {
      return call('updateSiteContent', adminToken(), body.version, body.content).then(function (d) {
        siteContentPromise = Promise.resolve(d);
        return d;
      });
    }
    if (path === '/api/admin/login' && method === 'POST') {
      return call('adminLogin', body.password).then(function (d) { setAdminToken(d.token); return { authenticated: true }; });
    }
    if (path === '/api/admin/session' && method === 'GET') {
      if (!adminToken()) return Promise.resolve({ authenticated: false });
      return call('adminSession', adminToken());
    }
    if (path === '/api/admin/logout' && method === 'POST') {
      var t = adminToken();
      setAdminToken('');
      return call('adminLogout', t);
    }
    if (path === '/api/projects' && method === 'POST') {
      return call('createProject', body.project).then(function (d) {
        sessions[d.token] = { project: d.project, version: d.version, updatedAt: d.updatedAt, role: d.role, roleLabel: d.roleLabel };
        d.__status = 201;
        return d;
      });
    }
    if ((m = /^\/api\/session\/([^\/]+)\/invites$/.exec(path)) && method === 'POST') {
      var oldToken = decodeURIComponent(m[1]);
      return call('createInvite', oldToken).then(function (d) {
        if (sessions[oldToken]) sessions[d.token] = sessions[oldToken];
        delete sessions[oldToken];
        d.__status = 201;
        return d;
      });
    }
    if ((m = /^\/api\/session\/([^\/]+)$/.exec(path))) {
      var token = decodeURIComponent(m[1]);
      if (method === 'GET') {
        var known = sessions[token];
        return call('getSession', token, known ? known.version : 0).then(function (d) {
          if (d.unchanged && known) {
            known.updatedAt = d.updatedAt || known.updatedAt;
            return known;
          }
          sessions[token] = d;
          return d;
        });
      }
      if (method === 'PUT') {
        return call('updateSession', token, body).then(function (d) {
          sessions[token] = d;
          return d;
        });
      }
    }
    return Promise.reject({ status: 404, error: '알 수 없는 요청입니다.' });
  }

  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    if (url.indexOf('/api/') === 0) {
      return route(url, init || {}).then(function (data) {
        var status = data && data.__status ? data.__status : 200;
        if (data && data.__status) delete data.__status;
        return respond(status, data);
      }, function (err) {
        var payload = (err && err.data) || {};
        payload.error = (err && err.error) || (err && err.message) || '요청을 처리하지 못했습니다.';
        return respond((err && err.status) || 500, payload);
      });
    }
    return originalFetch(input, init);
  };

  // 관리자 신청 목록에서 씁니다
  window.weddingServer = {
    call: call,
    adminToken: adminToken,
    shareUrl: function (token) { return location.origin + location.pathname + '?share=' + encodeURIComponent(token); }
  };
})();

function migrateIntegratedProject(p){if(!p)return p;let changed=false;const removedInternal=['신랑대기실 준비'],removedExternal=['화환·꽃·물품 수령','외부 업체 도착 확인','고령자·어린이 이동 지원','외부 업체 철수 확인'],oldInternal=p.internalOps.tasks||[],oldExternal=p.externalOps.tasks||[];p.internalOps.tasks=oldInternal.filter(x=>!removedInternal.includes(x));p.externalOps.tasks=oldExternal.filter(x=>!removedExternal.includes(x));if(p.internalOps.tasks.length!==oldInternal.length||p.externalOps.tasks.length!==oldExternal.length)changed=true;if(!p.teams.worship.personnel){p.teams.worship.personnel=worshipPeopleDefault();changed=true;}if(!p.teams.worship.songPersonnel){p.teams.worship.songPersonnel=songPeopleDefault();changed=true;}if(!p.teams.worship.instrumentalPersonnel){p.teams.worship.instrumentalPersonnel=instrumentalPeopleDefault();changed=true;}if(p.teams.photo.options?.includes('포토테이블')){p.teams.photo.options=p.teams.photo.options.filter(x=>x!=='포토테이블');changed=true;}p.organization.floors.forEach(f=>{if(typeof f.restored!=='boolean'){f.restored=false;changed=true;}if(typeof f.restoreNotes!=='string'){f.restoreNotes='';changed=true;}});if(!p.equipmentRequest.confirmed||p.equipmentRequest.status!=='기술팀 통합'){p.equipmentRequest.confirmed=true;p.equipmentRequest.status='기술팀 통합';changed=true;}if(changed)localStorage.setItem(PROJECT_KEY,JSON.stringify(p));return p;}
function migrateCaptionProject(p){if(!p)return p;let changed=false;const oldVideo=p.teams.video.options||[],caption=new Set(p.teams.caption.options||[]);if(oldVideo.includes('자막·식순'))caption.add('예식 순서·안내 화면');if(oldVideo.includes('가사 송출'))caption.add('가사 송출');if(oldVideo.includes('사진·영상 재생')){caption.add('식전 사진 재생');caption.add('식전 영상 재생');}const cleanVideo=oldVideo.filter(x=>!['자막·식순','가사 송출','사진·영상 재생'].includes(x));if(cleanVideo.length!==oldVideo.length){p.teams.video.options=cleanVideo;p.teams.caption.options=[...caption];changed=true;}const cleanWorship=(p.teams.worship.options||[]).filter(x=>x!=='교회 악기 사용');if(cleanWorship.length!==(p.teams.worship.options||[]).length){p.teams.worship.options=cleanWorship;changed=true;}if(typeof p.equipmentRequest.captionFileNotes!=='string'){p.equipmentRequest.captionFileNotes='';changed=true;}if(changed)localStorage.setItem(PROJECT_KEY,JSON.stringify(p));return p;}

function renderOverview(p,progress,teamDone){const v=document.getElementById('view'),opsDone=[p.internalOps,p.externalOps,p.placeRequest,p.equipmentRequest].filter(x=>x.confirmed).length;const ready=p.officiantConfirmed&&p.organization.confirmed&&p.meeting1&&opsDone===4&&teamDone===5;const stage=p.finalized?'최종 완료':p.meeting2?'최종 확정 준비':p.meeting1?'운영·전문팀 준비':p.officiantConfirmed?'담당자 구성·1차 회의':'주례 확인';v.innerHTML=`<div class="metrics"><div class="card metric"><span>현재 단계</span><strong>${stage}</strong></div><div class="card metric"><span>운영 신청</span><strong>${opsDone}/4 완료</strong></div><div class="card metric"><span>전문팀</span><strong>${teamDone}/5팀</strong></div></div><section class="card panel"><div class="panel-head"><div><h2>결혼예식 준비 현황</h2><p>운영 조직과 전문팀은 구분하여 준비하고, 전체 PD가 모든 내용을 최종 조율합니다.</p></div><span class="role-badge">${roleOptions[currentRole]}</span></div><div class="progress-row"><div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div><span class="progress-label">${progress}%</span></div><div class="workstream-grid"><article><p class="eyebrow">OPERATIONS</p><h3>예식 운영</h3><p>전체 PD · 내부 진행 · 외부 진행 · 층별 총괄 · 장소 신청</p><div class="summary-line"><span>담당자 구성</span><strong>${p.organization.confirmed?'완료':'준비 중'}</strong></div><div class="summary-line"><span>장소·장비 신청</span><strong>${p.placeRequest.confirmed&&p.equipmentRequest.confirmed?'완료':'준비 중'}</strong></div></article><article><p class="eyebrow">SPECIALIST TEAMS</p><h3>전문팀</h3><p>예배 · 음향 · 영상 · 사진 · 조명</p><div class="summary-line"><span>팀 확인</span><strong>${teamDone}/5팀</strong></div><div class="summary-line"><span>수정 권한</span><strong>본인 팀만</strong></div></article></div></section><section class="card panel"><div class="panel-head"><div><h2>전문팀 현황</h2><p>각 팀 역할에서는 공통 정보를 확인하고 본인 팀 내용만 작성할 수 있습니다.</p></div></div><div class="team-grid">${Object.entries(teams).map(([k,t])=>{const d=p.teams[k];return `<article class="team-card"><div class="team-head"><div class="team-icon">$   v.querySelectorAll('.open-view').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;render();});if(currentRole!=='pd')return;const bind=(id,key,on,off)=>{const el=document.getElementById(id);if(el)el.onclick=()=>{p[key]=!p[key];p.activity.unshift({at:now(),text:p[key]?on:off});saveProject(p,p[key]?on:off);render();};};bind('toggleOfficiant','officiantConfirmed','주례가 확정되었습니다.','주례 확정이 취소되었습니다.');bind('toggleMeeting1','meeting1','1차 회의가 완료되었습니다.','1차 회의 완료가 취소되었습니다.');bind('toggleMeeting2','meeting2','2차 회의가 완료되었습니다.','2차 회의 완료가 취소되었습니다.');const f=document.getElementById('toggleFinal');if(f)f.onclick=()=>{p.finalized=true;p.finalizedAt=now();p.activity.unshift({at:now(),text:'전체 PD가 프로젝트를 최종 확정했습니다.'});saveProject(p,'결혼예식 준비를 최종 확정했습니다.');render();};const u=document.getElementById('unlockFinal');if(u)u.onclick=()=>{if(!confirm('최종 확정을 해제할까요?'))return;p.finalized=false;p.finalizedAt='';saveProject(p,'최종 확정을 해제했습니다.');render();};const doc=document.getElementById('openDocument');if(doc)doc.onclick=()=>{currentView='document';render();};
}

const renderOverviewBase=renderOverview;
renderOverview=function(p,progress,teamDone){renderOverviewBase(p,progress,teamDone);const v=document.getElementById('view'),opsDone=[p.internalOps,p.externalOps,p.placeRequest].filter(x=>x.confirmed).length,teamTotal=Object.keys(teams).length,metrics=v.querySelectorAll('.metric strong');if(metrics[1])metrics[1].textContent=`${opsDone}/3 완료`;if(metrics[2])metrics[2].textContent=`${teamDone}/${teamTotal}팀`;v.querySelectorAll('.summary-line').forEach(line=>{const label=line.querySelector('span'),value=line.querySelector('strong');if(label?.textContent==='장소·장비 신청')label.textContent='장소사용 신청';if(label?.textContent==='팀 확인'&&value)value.textContent=`${teamDone}/${teamTotal}팀`;});v.querySelectorAll('.workstream-grid article p').forEach(x=>{if(x.textContent==='예배 · 음향 · 영상 · 사진 · 조명')x.textContent='예배 · 음향 · 영상 · 자막 · 사진 · 조명';});const meeting2=document.getElementById('toggleMeeting2'),ready=p.officiantConfirmed&&p.organization.confirmed&&p.meeting1&&opsDone===3&&teamDone===teamTotal;if(meeting2)meeting2.disabled=!ready;renameTechnicalCopy(v);};

function renderShared(p){const edit=canEdit('shared',p),v=document.getElementById('view');v.innerHTML=`<section class="card panel"><div class="panel-head"><div><h2>공통 예식 정보</h2><p>모든 역할이 확인하는 기준 정보입니다. 변경하면 운영·전문팀의 재확인이 필요합니다.</p></div><span class="sync-pill">전체 역할 동기화</span></div>${!edit?'<div class="locked-notice">현재 역할은 공통 정보를 열람만 할 수 있습니다.</div>':''}<form id="sharedForm"><div class="grid2"><div class="field"><label class="required">예식 날짜</label><input name="date" type="date" value="${esc(p.date)}" required></div><div class="field"><label class="required">시작 시간</label><input name="time" type="time" value="${esc(p.time)}" required></div><div class="field"><label>종료 예정</label><input name="endTime" type="time" value="${esc(p.endTime)}"></div><div class="field"><label>예식 장소</label><input name="venue" value="${esc(p.venue)}"></div><div class="field"><label>전체 리허설</label><input name="rehearsal" type="datetime-local" value="${esc(p.rehearsal)}"></div><div class="field"><label>다음 교회 일정</label><input name="nextSchedule" value="${esc(p.nextSchedule)}"></div><div class="field full"><label>전체 식순 및 공통 메모</label><textarea name="orderOfService">${esc(p.orderOfService)}</textarea></div></div><div class="form-actions"><p>저장 즉시 모든 역할 화면에 반영됩니다.</p><button class="primary-btn">공통 정보 저장</button></div></form></section>`;const form=document.getElementById('sharedForm');if(!edit){form.querySelectorAll('input,textarea,button').forEach(el=>el.disabled=true);return;}form.onsubmit=e=>{e.preventDefault();Object.assign(p,Object.fromEntries(new FormData(form)));[p.internalOps,p.externalOps,p.placeRequest,...Object.values(p.teams)].forEach(x=>{if(x.confirmed){x.confirmed=false;x.status='변경 확인 필요';}});p.meeting2=false;p.finalized=false;p.activity.unshift({at:now(),text:'공통 정보가 변경되어 관련 역할의 재확인이 필요합니다.'});saveProject(p,'공통 정보를 동기화했습니다.');render();};}

function renderOrganization(p){const edit=canEdit('organization',p),o=p.organization,v=document.getElementById('view'),floorAssigned=o.floors.filter(f=>f.name).length;const roleCard=(key,data,status,lead,phone)=>`<article class="role-guide-card"><div class="role-guide-head"><div><p class="eyebrow">${key==='internal'?'INSIDE':key==='external'?'OUTSIDE':'FLOOR'}</p><h3>${data.title}</h3></div><span class="status ${status?'confirmed':'pending'}">${status?'확인 완료':'준비 중'}</span></div><p class="role-scope">${data.scope}</p><ul>${data.items.map(item=>`<li>${item}</li>`).join('')}</ul><div class="role-owner"><span>담당</span><strong>${esc(lead||'미정')}</strong><small>${esc(phone||'연락처 미정')}</small></div><button type="button" class="secondary-btn open-role" data-view="${key}" ${canAccess(key)?'':'disabled'}>세부 준비 열기</button></article>`;v.innerHTML=`<section class="card panel"><div class="panel-head"><div><p class="eyebrow">WEDDING OPERATIONS CONTROL</p><h2>전체 총괄</h2><p>전체 PD가 예식 당일의 모든 흐름을 확인하고 내·외부 및 층별 총괄에게 실행 범위를 배정합니다.</p></div><span class="status ${o.confirmed?'confirmed':'pending'}">${o.status}</span></div>${!edit?'<div class="locked-notice">전체 PD만 전체 총괄 내용을 수정할 수 있습니다. 다른 역할은 배정 내용과 체크사항을 확인합니다.</div>':''}<div class="command-metrics"><div><span>전체 PD 체크</span><strong>${o.pdTasks.length}/${pdTasks.length}</strong></div><div><span>내부 진행</span><strong>${p.internalOps.tasks.length}/${internalTasks.length}</strong></div><div><span>외부 진행</span><strong>${p.externalOps.tasks.length}/${externalTasks.length}</strong></div><div><span>층별 배정</span><strong>${floorAssigned}/${o.floors.length}</strong></div></div><form id="orgForm"><section class="pd-command"><div class="pd-command-head"><div><span class="command-mark">PD</span><div><h3>전체 PD 지휘 영역</h3><p>화환·꽃 장식 수령부터 예식 종료와 원상복구까지 최종 확인합니다.</p></div></div><span class="role-badge">전체 정보 열람·수정</span></div><div class="grid2"><div class="field"><label>전체 PD</label><input name="pdName" value="${esc(o.pdName)}" placeholder="이름"></div><div class="field"><label>연락처</label><input name="pdPhone" value="${esc(o.pdPhone)}" placeholder="당일 연락처"></div></div><div class="form-section-head top-gap"><h3>전체 PD 당일 체크</h3><p>직접 처리하거나 담당자에게 배정한 뒤, 완료 여부를 확인합니다.</p></div><div class="choice-grid">${pdTasks.map(x=>checkCard('pdTasks',x,o.pdTasks.includes(x))).join('')}</div><div class="field top-gap"><label>전체 지시·돌발 상황·인수인계 메모</label><textarea name="pdNotes" placeholder="누가, 언제, 어디에서 처리할지 구체적으로 적어주세요.">${esc(o.pdNotes)}</textarea></div><div class="attention-box"><strong>전체 PD가 특히 신경 쓸 것</strong><ul><li>역할이 겹치거나 빠지는 업무는 전체 PD가 최종 담당자를 지정합니다.</li><li>일정·장소·장비 변경은 내·외부, 층별, 전문팀에 동시에 공유합니다.</li><li>당일 비상 연락망과 의사결정 창구는 전체 PD 한 사람으로 모읍니다.</li></ul></div></section><section class="form-section"><div class="form-section-head"><h3>산하 운영 총괄</h3><p>각 총괄의 책임 범위와 반드시 확인할 내용을 기준으로 업무를 나눕니다.</p></div><div class="role-guide-grid">${roleCard('internal',roleGuides.internal,p.internalOps.confirmed,o.internalName,o.internalPhone)}${roleCard('external',roleGuides.external,p.externalOps.confirmed,o.externalName,o.externalPhone)}${roleCard('floors',roleGuides.floors,floorAssigned===o.floors.length,`${floorAssigned}명 배정`,`${o.floors.length}개 층`)}</div></section><section class="form-section"><div class="form-section-head"><h3>내·외부 총괄 배정</h3></div><div class="grid2"><div class="field"><label>내부 진행 총괄</label><input name="internalName" value="${esc(o.internalName)}"></div><div class="field"><label>연락처</label><input name="internalPhone" value="${esc(o.internalPhone)}"></div><div class="field"><label>외부 진행 총괄</label><input name="externalName" value="${esc(o.externalName)}"></div><div class="field"><label>연락처</label><input name="externalPhone" value="${esc(o.externalPhone)}"></div></div></section><section class="form-section"><div class="form-section-head"><h3>층별 총괄 배정</h3><p>각 층의 총괄은 담당 공간과 동선을 세부 화면에서 이어서 작성합니다.</p></div><div class="floor-assignment-grid">${o.floors.map((f,i)=>`<div class="floor-assignment"><strong>${esc(f.floor)}</strong><input name="floor_${i}_name" value="${esc(f.name)}" placeholder="담당자"><input name="floor_${i}_phone" value="${esc(f.phone)}" placeholder="연락처"></div>`).join('')}</div></section><section class="form-section"><div class="form-section-head"><h3>전문팀 담당자</h3><p>각 팀은 지정된 본인 팀 내용만 수정합니다.</p></div><div class="assignment-grid">${Object.entries(teams).map(([k,t])=>`<div class="assignment-card"><strong>${t.name}</strong><input name="team_${k}_lead" value="${esc(p.teams[k].lead)}" placeholder="담당자"><input name="team_${k}_phone" value="${esc(p.teams[k].phone)}" placeholder="연락처"></div>`).join('')}</div></section><div class="signoff"><label><input type="checkbox" name="confirmed" ${o.confirmed?'checked':''}><span><strong>전체 운영 조직 구성 완료</strong><small>전체 PD, 내·외부 진행, 층별 및 전문팀 담당자와 책임 범위를 확인했습니다.</small></span></label></div><div class="form-actions"><p>운영 조직 구성 후 1차 회의를 진행합니다.</p><button class="primary-btn save-org">전체 총괄 저장</button></div></form></section>`;v.querySelectorAll('.open-role').forEach(b=>b.onclick=()=>{if(!b.disabled){currentView=b.dataset.view;render();}});const form=document.getElementById('orgForm');if(!edit){form.querySelectorAll('input,textarea').forEach(el=>el.disabled=true);form.querySelector('.save-org').disabled=true;return;}form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);['pdName','pdPhone','internalName','internalPhone','externalName','externalPhone','pdNotes'].forEach(k=>o[k]=fd.get(k)||'');o.pdTasks=fd.getAll('pdTasks');o.floors.forEach((f,i)=>{f.name=fd.get(`floor_${i}_name`)||'';f.phone=fd.get(`floor_${i}_phone`)||'';});Object.keys(teams).forEach(k=>{p.teams[k].lead=fd.get(`team_${k}_lead`)||'';p.teams[k].phone=fd.get(`team_${k}_phone`)||'';});o.confirmed=fd.get('confirmed')==='on';o.status=o.confirmed?'확인 완료':'작성 중';p.activity.unshift({at:now(),text:'전체 총괄 조직과 역할별 책임이 저장되었습니다.'});saveProject(p,'전체 총괄 내용을 저장했습니다.');render();};}

function renderOperations(p,type){const internal=type==='internal',data=internal?p.internalOps:p.externalOps,tasks=internal?internalTasks:externalTasks,name=internal?'내부 진행':'외부 진행',edit=canEdit(type,p),v=document.getElementById('view');v.innerHTML=`<section class="card panel"><div class="panel-head"><div><p class="eyebrow">OPERATIONS</p><h2>${name}</h2><p>${internal?'예식장 내부의 대기실·축의대·순서자·꽃 장식과 공간 운영을 관리합니다.':'주차·방문객 안내·외부 업체·물품 수령과 차량 동선을 관리합니다.'}</p></div><span class="status ${data.confirmed?'confirmed':'pending'}">${data.status}</span></div>${!edit?`<div class="locked-notice">현재 역할은 ${name} 내용을 열람만 할 수 있습니다.</div>`:''}<form id="opsForm"><div class="grid2"><div class="field"><label>${name} 총괄</label><input name="lead" value="${esc(data.lead||(internal?p.organization.internalName:p.organization.externalName))}"></div><div class="field"><label>연락처</label><input name="phone" value="${esc(data.phone||(internal?p.organization.internalPhone:p.organization.externalPhone))}"></div></div><section class="form-section"><div class="form-section-head"><h3>업무 체크리스트</h3><p>담당자를 배치하고 준비가 끝난 항목을 확인합니다.</p></div><div class="choice-grid">${tasks.map(t=>checkCard('tasks',t,data.tasks.includes(t))).join('')}</div></section><div class="field"><label>담당 배치 및 특이사항</label><textarea name="notes">${esc(data.notes)}</textarea></div><section class="form-section"><div class="signoff"><label><input type="checkbox" name="confirmed" ${data.confirmed?'checked':''}><span><strong>${name} 최종 확인</strong><small>담당자, 동선과 준비 항목을 확인했습니다.</small></span></label></div></section><div class="form-actions"><p>전체 PD는 두 진행 영역을 함께 확인합니다.</p><button class="primary-btn">${name} 저장</button></div></form></section>`;const form=document.getElementById('opsForm');if(!edit){form.querySelectorAll('input,textarea,button').forEach(el=>el.disabled=true);return;}form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);data.lead=fd.get('lead')||'';data.phone=fd.get('phone')||'';data.tasks=fd.getAll('tasks');data.notes=fd.get('notes')||'';data.confirmed=fd.get('confirmed')==='on';data.status=data.confirmed?'확인 완료':'작성 중';p.meeting2=false;p.activity.unshift({at:now(),text:`${name} 내용이 저장되었습니다.`});saveProject(p,`${name} 내용을 저장했습니다.`);render();};}

function renderFloors(p){const edit=canEdit('floors',p),v=document.getElementById('view');v.innerHTML=`<section class="card panel"><div class="panel-head"><div><h2>층별 총괄</h2><p>각 층의 사용 공간, 담당자, 방문객 동선과 원상복구를 관리합니다.</p></div></div>${!edit?'<div class="locked-notice">전체 PD·내부 진행 총괄·층별 총괄만 수정할 수 있습니다.</div>':''}<form id="floorForm"><div class="floor-grid">${p.organization.floors.map((f,i)=>`<article class="floor-card"><div class="floor-number">${esc(f.floor)}</div><div class="grid2"><div class="field"><label>총괄 담당자</label><input name="floor_${i}_name" value="${esc(f.name)}"></div><div class="field"><label>연락처</label><input name="floor_${i}_phone" value="${esc(f.phone)}"></div><div class="field full"><label>담당 공간</label><input name="floor_${i}_spaces" value="${esc(f.spaces)}" placeholder="예: 라운지, 대기실, 예식장"></div><div class="field full"><label>동선·비품·특이사항</label><textarea name="floor_${i}_notes">${esc(f.notes)}</textarea></div></div></article>`).join('')}</div><div class="form-actions"><p>장소사용 신청 내용과 함께 확인합니다.</p><button class="primary-btn">층별 담당 저장</button></div></form></section>`;const form=document.getElementById('floorForm');if(!edit){form.querySelectorAll('input,textarea,button').forEach(el=>el.disabled=true);return;}form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);p.organization.floors.forEach((f,i)=>{f.name=fd.get(`floor_${i}_name`)||'';f.phone=fd.get(`floor_${i}_phone`)||'';f.spaces=fd.get(`floor_${i}_spaces`)||'';f.notes=fd.get(`floor_${i}_notes`)||'';});p.activity.unshift({at:now(),text:'층별 총괄 담당자와 공간이 저장되었습니다.'});saveProject(p,'층별 담당을 저장했습니다.');render();};}

function renderPlaces(p){const d=p.placeRequest,edit=canEdit('places',p),v=document.getElementById('view');v.innerHTML=`<section class="card panel"><div class="panel-head"><div><p class="eyebrow">원본 장소사용 신청서 반영</p><h2>장소사용 신청</h2><p>사용할 공간만 켜고 시작·종료 시간과 담당자를 작성합니다.</p></div><span class="status ${d.confirmed?'confirmed':'pending'}">${d.status}</span></div><div class="guide"><span class="guide-icon">i</span><div><strong>장소 사용 안내</strong><p>예식 후 청소와 원상복구를 진행합니다. 날짜 확정과 세부 절차는 담당 교역자와 협의합니다.</p></div></div>${!edit?'<div class="locked-notice">신랑·신부, 내부 진행 총괄과 전체 PD만 수정할 수 있습니다.</div>':''}<form id="placeForm"><div class="grid2"><div class="field"><label>신청자</label><input name="requester" value="${esc(d.requester||p.groom)}"></div><div class="field"><label>연락처</label><input name="phone" value="${esc(d.phone||p.groomPhone)}"></div></div><div class="space-list">${placeNames.map((name,i)=>{const s=d.spaces[name];return `<article class="space-row ${s.used?'is-used':''}"><label class="space-toggle"><input type="checkbox" name="space_${i}_used" ${s.used?'checked':''}><span><strong>${esc(name)}</strong></span></label><div class="space-fields"><div class="field"><label>사용 시작</label><input type="time" step="600" name="space_${i}_start" value="${esc(s.start)}"></div><div class="field"><label>사용 종료</label><input type="time" step="600" name="space_${i}_end" value="${esc(s.end)}"></div><div class="field"><label>장소 담당자</label><input name="space_${i}_lead" value="${esc(s.lead)}"></div></div></article>`;}).join('')}</div><div class="field top-gap"><label>장소 사용 및 원상복구 메모</label><textarea name="notes">${esc(d.notes)}</textarea></div><div class="signoff top-gap"><label><input type="checkbox" name="confirmed" ${d.confirmed?'checked':''}><span><strong>장소사용 신청 완료</strong><small>사용 공간, 시간, 담당자와 원상복구 계획을 확인했습니다.</small></span></label></div><div class="form-actions"><p>사용하지 않는 공간은 입력하지 않아도 됩니다.</p><button class="primary-btn">장소사용 신청 저장</button></div></form></section>`;const form=document.getElementById('placeForm');if(!edit){form.querySelectorAll('input,textarea,button').forEach(el=>el.disabled=true);return;}form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);d.requester=fd.get('requester')||'';d.phone=fd.get('phone')||'';placeNames.forEach((name,i)=>{const s=d.spaces[name];s.used=fd.get(`space_${i}_used`)==='on';s.start=fd.get(`space_${i}_start`)||'';s.end=fd.get(`space_${i}_end`)||'';s.lead=fd.get(`space_${i}_lead`)||'';});d.notes=fd.get('notes')||'';d.confirmed=fd.get('confirmed')==='on';d.status=d.confirmed?'확인 완료':'작성 중';p.meeting2=false;p.activity.unshift({at:now(),text:'장소사용 신청이 저장되었습니다.'});saveProject(p,'장소사용 신청을 저장했습니다.');render();};}

function selectField(name,value,options){return `<label>장비 사용<select name="${name}">${options.map(x=>`<option value="${esc(x)}" ${value===x?'selected':''}>${esc(x||'선택해 주세요')}</option>`).join('')}</select></label>`;}

alGear,['','교회 악기를 사용하기 원합니다.','본인 악기를 지참합니다.'])}</div></section><section class="form-section"><div class="form-section-head"><h3>3. 영상·자막·조명·사진</h3></div><div class="equipment-grid"><div class="equipment-card"><strong>영상팀</strong><label>카메라 수량<select name="cameraCount">${['1대','2대','3대','4대','5대','기타'].map(x=>`<option ${d.cameraCount===x?'selected':''}>${x}</option>`).join('')}</select></label>${selectField('videoGear',d.videoGear,['','교회 장비를 사용하기 원합니다.','본인 장비를 사용합니다.'])}</div><div class="equipment-card"><strong>자막팀</strong>${selectField('captionGear',d.captionGear,['','교회 장비를 사용하기 원합니다.','본인 장비를 사용합니다.'])}</div><div class="equipment-card"><strong>조명팀</strong>${selectField('lightingGear',d.lightingGear,['','교회 장비를 사용하기 원합니다.','본인 또는 외부 장비를 사용합니다.'])}</div><div class="equipment-card"><strong>사진팀</strong>${selectField('photoGear',d.photoGear,['','교회 장비를 사용하기 원합니다.','본인 또는 외부 장비를 사용합니다.'])}</div></div></section><div class="field"><label>추가 장비 및 협의 메모</label><textarea name="notes">${esc(d.notes)}</textarea></div><div class="signoff top-gap"><label><input type="checkbox" name="confirmed" ${d.confirmed?'checked':''}><span><strong>대예배실 및 장비사용 신청 완료</strong><small>선택 내용을 관련 전문팀이 다시 확인합니다.</small></span></label></div><div class="form-actions"><p>저장하면 관련 전문팀이 ‘변경 확인 필요’ 상태로 돌아갑니다.</p><button class="primary-btn">장비사용 신청 저장</button></div></form></section>`;const form=document.getElementById('equipmentForm');if(!edit){form.querySelectorAll('input,textarea,select,button').forEach(el=>el.disabled=true);return;}form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);['requester','phone','dateTime','audioPlan','worshipCount','worshipGear','songCount','songGear','instrumentalCount','instrumentalGear','cameraCount','videoGear','captionGear','lightingGear','photoGear','notes'].forEach(k=>d[k]=fd.get(k)||'');d.neededTeams=fd.getAll('neededTeams');d.programTypes=fd.getAll('programTypes');d.confirmed=fd.get('confirmed')==='on';d.status=d.confirmed?'확인 완료':'작성 중';Object.values(p function migrateVideoTeam(p){if(!p)return p;const d=p.teams.video;let changed=false;if(!Array.isArray(d.videoRequests)){d.videoRequests=[];changed=true;}if(!Array.isArray(d.videoEquipment)){d.videoEquipment=[];changed=true;}if(!Array.isArray(d.videoDeliverables)){d.videoDeliverables=[];changed=true;}const old=d.options||[],legacy=old.some(x=>['외부 영상업체','외부 업체','예식 중계','예식 녹화','카메라 1대','카메라 2대 이상'].includes(x));if(legacy){const mapped=[];if(old.some(x=>!['외부 영상업체','외부 업체','촬영 업체','예식 중계','예식 녹화','카메라 1대','카메라 2대 이상'].includes(x)))mapped.push('주님의교회 영상팀');if(old.some(x=>['외부 영상업체','외부 업체','촬영 업체'].includes(x)))mapped.push('촬영 업체');if(old.some(x=>x==='예식 중계'))d.videoRequests.push('예식 전체 중계 및 촬영');if(old.some(x=>x==='예식 녹화'))d.videoRequests.push('예식 촬영(녹화)');if(old.some(x=>x==='카메라 1대'||x==='카메라 2대 이상'))d.videoEquipment.push('카메라');d.options=mapped;changed=true;}d.videoRequests=[...new Set(d.videoRequests)];d.videoEquipment=[...new Set(d.videoEquipment)];if(changed)localStorage.setItem(PROJECT_KEY,JSON.stringify(p));return p;}

<script>
/* ===== cue-v1.js (원래 사이트 코드) ===== */
const cueSequencesKo=['식전 영상','안내 방송','예배팀 입장','개식사','예배','주례자 등단','신랑 입장','신부 입장','주례사','혼인서약','성혼선포','성찬','반지 교환','축가','부모님·하객 인사','신랑·신부 행진','폐식사','사진 촬영'];

function cueInput(label,field,value,type='text'){return `<label>${label}<input type="${type}" data-cue-field="${field}" value="${esc(value||'')}"></label>`;}
function cueTextarea(label,field,value,placeholder=''){return `<label>${label}<textarea data-cue-field="${field}" placeholder="${esc(placeholder)}">${esc(value||'')}</textarea></label>`;}
function cueRowHtml(row,index){return `<article class="cue-row"><div class="cue-row-head"><strong>순서 <span class="cue-index">${index+1}</span></strong><div class="cue-row-actions"><button type="button" data-cue-move="up" aria-label="위로 이동">↑</button><button type="button" data-cue-move="down" aria-label="아래로 이동">↓</button><button type="button" data-cue-remove aria-label="순서 삭제">삭제</button></div></div><div class="cue-row-grid">${cueInput('시작','start',row.start,'time')}${cueInput('종료','end',row.end,'time')}${cueInput('역할','role',row.role)}${cueInput('예식 순서','content',row.content)}${cueTextarea('사회자 대본','script',row.script,'멘트 또는 진행 대본')}${cueTextarea('화면·자막','screen',row.screen,'배경, 가사, 자막, 재생 화면')}${cueTextarea('음향·BGM','audio',row.audio,'곡명, 파일명, 시작·종료 큐')}${cueTextarea('영상','video',row.video,'촬영 대상과 중계 범위')}${cueTextarea('조명','lighting',row.lighting,'밝기, 색상, 전환 큐')}${cueTextarea('기타','notes',row.notes,'준비물과 전달 사항')}</div></article>`;}
function cueListHtml(rows,lang,hidden=false){return `<div class="cue-list ${hidden?'hidden':''}" data-cue-list="${lang}">${rows.map(cueRowHtml).join('')}</div><button class="secondary-btn cue-add ${hidden?'hidden':''}" type="button" data-add-cue="${lang}">순서 추가</button>`;}
function attachmentHtml(a){if(!a)return '<span class="muted">첨부된 파일이 없습니다.</span>';return `<div class="cue-file"><div><strong>${esc(a.name)}</strong><small>${esc(a.uploadedAt||'')}</small></div><div class="actions"><button type="button" class="secondary-btn" id="downloadCue">다운로드</button><button type="button" class="danger-btn" id="removeCue">삭제</button></div></div>`;}
function collectCueDraft(form,p){p.mcName=form.querySelector('#mcName')?.value||'';p.mcPhone=form.querySelector('#mcPhone')?.value||'';p.mcRelation=form.querySelector('#mcRelation')?.value||'';['ko','en'].forEach(lang=>{p[lang==='ko'?'cueRowsKo':'cueRowsEn']=[...form.querySelectorAll(`[data-cue-list="${lang}"] .cue-row`)].map(row=>Object.fromEntries([...row.querySelectorAll('[data-cue-field]')].map(el=>[el.dataset.cueField,el.value.trim()])));});}
function refreshCueIndexes(list){list.querySelectorAll('.cue-index').forEach((el,i)=>el.textContent=i+1);}

const renderSharedCueBase=renderShared;
renderShared=function(p){migrateCueProject(p);renderSharedCueBase(p);const form=document.getElementById('sharedForm');if(!form)return;const orderLabel=[...form.querySelectorAll('label')].find(x=>x.textContent.trim()==='전체 식순 및 공통 메모');if(orderLabel)orderLabel.firstChild.textContent='전체 공통 메모';const actions=form.querySelector('.form-actions'),section=document.createElement('section');section.className='form-section cue-builder';section.innerHTML=`<div class="form-section-head"><h3>사회자 정보</h3><p>전체 진행과 기술팀이 함께 확인하는 사회자 정보입니다.</p></div><div class="grid3"><label>사회자 이름<input id="mcName" value="${esc(p.mcName)}"></label><label>연락처<input id="mcPhone" type="tel" value="${esc(p.mcPhone)}"></label><label>소속 또는 관계<input id="mcRelation" value="${esc(p.mcRelation)}" placeholder="예: 주님의교회 담당 목회자"></label></div><div class="form-section-head top-gap"><h3>전체 큐시트 첨부</h3><p>원본 큐시트를 함께 보관합니다. 현재 목업에서는 이 브라우저에 저장됩니다.</p></div><div class="cue-upload"><input type="file" id="cueFile" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg"><div id="cueFileStatus">${attachmentHtml(p.cueAttachment)}</div></div><div class="form-section-head top-gap"><h3>마스터 큐시트</h3><p>한글과 영문을 각각 작성합니다. 저장하면 관련 기술팀 화면과 통합 문서에 반영됩니다.</p></div><div class="cue-tabs" role="tablist"><button type="button" class="active" data-cue-tab="ko">한글 큐시트</button><button type="button" data-cue-tab="en">English Cue Sheet</button></div>${cueListHtml(p.cueRowsKo,'ko')}${cueListHtml(p.cueRowsEn,'en',true)}`;form.insertBefore(section,actions);
  const previousSubmit=form.onsubmit;form.onsubmit=e=>{collectCueDraft(form,p);previousSubmit(e);};
  section.onclick=e=>{const tab=e.target.closest('[data-cue-tab]');if(tab){const lang=tab.dataset.cueTab;section.querySelectorAll('[data-cue-tab]').forEach(x=>x.classList.toggle('active',x===tab));section.querySelectorAll('[data-cue-list],.cue-add').forEach(x=>x.classList.toggle('hidden',(x.dataset.cueList||x.dataset.addCue)!==lang));return;}const add=e.target.closest('[data-add-cue]');if(add){const list=section.querySelector(`[data-cue-list="${add.dataset.addCue}"]`);list.insertAdjacentHTML('beforeend',cueRowHtml(emptyCueRow(''),list.children.length));return;}const remove=e.target.closest('[data-cue-remove]');if(remove){const list=remove.closest('.cue-list');remove.closest('.cue-row').remove();refreshCueIndexes(list);return;}const move=e.target.closest('[data-cue-move]');if(move){const row=move.closest('.cue-row'),list=row.parentElement;if(move.dataset.cueMove==='up'&&row.previousElementSibling)list.insertBefore(row,row.previousElementSibling);if(move.dataset.cueMove==='down'&&row.nextElementSibling)list.insertBefore(row.nextElementSibling,row);refreshCueIndexes(list);return;}if(e.target.id==='downloadCue'&&p.cueAttachment){const a=document.createElement('a');a.href=p.cueAttachment.data;a.download=p.cueAttachment.name;a.click();}if(e.target.id==='removeCue'){if(!confirm('첨부된 전체 큐시트를 삭제할까요?'))return;collectCueDraft(form,p);p.cueAttachment=null;p.activity.unshift({at:now(),text:'전체 큐시트 첨부파일이 삭제되었습니다.'});saveProject(p,'큐시트 첨부파일을 삭제했습니다.');render();}};
  document.getElementById('cueFile').onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>1500000){showToast('큐시트 파일은 1.5MB 이하로 올려주세요.');e.target.value='';return;}const reader=new FileReader();reader.onload=()=>{collectCueDraft(form,p);p.cueAttachment={name:file.name,type:file.type,size:file.size,data:reader.result,uploadedAt:now()};Object.values(p.teams).forEach(t=>{if(t.confirmed){t.confirmed=false;t.status='큐시트 변경 확인 필요';}});p.activity.unshift({at:now(),text:`전체 큐시트 ${file.name} 파일이 첨부되었습니다.`});saveProject(p,'전체 큐시트를 첨부했습니다.');render();};reader.readAsDataURL(file);};
};

function relevantCueRows(p,key,lang){const rows=lang==='ko'?p.cueRowsKo:p.cueRowsEn;return rows.map(row=>{let detail='';if(key==='audio')detail=row.audio;if(key==='video')detail=row.video;if(key==='caption')detail=row.screen;if(key==='lighting')detail=row.lighting;if(key==='worship'&&/(예배|축가|축주|worship|song)/i.test(`${row.role} ${row.content}`))detail=[row.role,row.notes].filter(Boolean).join(' · ');if(key==='photo'&&/(사진|photo)/i.test(`${row.content} ${row.notes}`))detail=[row.video,row.notes].filter(Boolean).join(' · ');return {...row,detail};}).filter(row=>row.detail);}
function teamCueBlock(p,key){const ko=relevantCueRows(p,key,'ko'),en=relevantCueRows(p,key,'en');if(!ko.length&&!en.length)return '';const list=(rows,label)=>`<details ${label==='한글'?'open':''}><summary>${label} 관련 큐 ${rows.length}개</summary><div class="team-cue-list">${rows.map(r=>`<div><span>${esc([r.start,r.end].filter(Boolean).join('–')||'시간 미정')}</span><strong>${esc(r.content||'순서 미정')}</strong><p>${textBlock(r.detail)}</p></div>`).join('')}</div></details>`;return `<section class="team-cue-reference"><div class="form-section-head"><h3>마스터 큐시트 연동</h3><p>공통 정보에서 작성한 이 팀의 관련 큐입니다.</p></div>${ko.length?list(ko,'한글'):''}${en.length?list(en,'English'):''}</section>`;}

const renderDocumentCueBase=renderDocument;
renderDocument=function(p){renderDocumentCueBase(p);const article=document.querySelector('#view .print-document');if(!article)return;const org=[...article.querySelectorAll('.doc-section')].find(s=>s.querySelector('h2')?.textContent==='운영 조직');const attachment=p.cueAttachment?`${esc(p.cueAttachment.name)} · ${esc(p.cueAttachment.uploadedAt||'')}`:'첨부 없음';const social=document.createElement('section');social.className='doc-section';social.innerHTML=`<h2>사회자 및 전체 큐시트</h2><table class="doc-table"><tr><th>사회자</th><td>${esc(p.mcName||'미정')} · ${esc(p.mcPhone||'연락처 미정')}</td><th>소속·관계</th><td>${esc(p.mcRelation||'미정')}</td></tr><tr><th>원본 첨부</th><td colspan="3">${attachment}</td></tr></table>`;const cueDoc=(title,rows)=>{const section=document.createElement('section');section.className='doc-section cue-doc';section.innerHTML=`<h2>${title}</h2><table class="doc-table"><tr><th>시간</th><th>역할</th><th>예식 순서</th><th>사회자 대본</th><th>기술팀 큐</th></tr>${rows.map(r=>`<tr><td>${esc([r.start,r.end].filter(Boolean).join('–')||'')}</td><td>${esc(r.role)}</td><td>${esc(r.content)}</td><td>${textBlock(r.script||'')}</td><td>${['화면·자막 '+(r.screen||''),'음향·BGM '+(r.audio||''),'영상 '+(r.video||''),'조명 '+(r.lighting||''),'기타 '+(r.notes||'')].filter(x=>!x.endsWith(' ')).map(esc).join('<br>')}</td></tr>`).join('')}</table>`;return section;};if(org){org.before(social);org.before(cueDoc('마스터 큐시트 · 한글',p.cueRowsKo));org.before(cueDoc('Master Cue Sheet · English',p.cueRowsEn));}}

const renderDocumentCueCleanBase=renderDocument;
renderDocument=function(p){renderDocumentCueCleanBase(p);document.querySelectorAll('#view .cue-doc td').forEach(cell=>{if(cell.textContent.trim()==='작성된 내용이 없습니다.')cell.textContent='';});};

const renderDocumentStandaloneCueBase=renderDocument;
renderDocument=function(p){renderDocumentStandaloneCueBase(p);const sections=[...document.querySelectorAll('#view .doc-section')],summary=sections.find(s=>s.querySelector('h2')?.textContent==='사회자 및 전체 큐시트'),ko=sections.find(s=>s.querySelector('h2')?.textContent==='마스터 큐시트 · 한글'),en=sections.find(s=>s.querySelector('h2')?.textContent==='Master Cue Sheet · English');summary?.classList.add('cue-summary-doc','cue-summary-ko');ko?.classList.add('cue-doc-ko');en?.classList.add('cue-doc-en');if(summary){const summaryEn=summary.cloneNode(true),headers=summaryEn.querySelectorAll('th');summaryEn.className='doc-section cue-summary-doc cue-summary-en';summaryEn.querySelector('h2').textContent='MC & Master Cue Sheet';['MC','Affiliation / Relation','Original Attachment'].forEach((label,i)=>{if(headers[i])headers[i].textContent=label;});summary.after(summaryEn);}if(en){const headers=en.querySelectorAll('tr:first-child th');['Time','Role','Ceremony Order','MC Script','Technical Cues'].forEach((label,i)=>{if(headers[i])headers[i].textContent=label;});}const actions=document.querySelector('#view .document-actions'),fullPrint=document.getElementById('printDocument');if(!actions||!fullPrint)return;const buttons=document.createElement('div');buttons.className='document-print-buttons';fullPrint.before(buttons);buttons.append(fullPrint);fullPrint.textContent='통합 문서 인쇄 · PDF 저장';[['ko','한글 큐시트만 출력'],['en','English Cue Sheet 출력']].forEach(([lang,label])=>{const button=document.createElement('button');button.type='button';button.className='secondary-btn';button.textContent=label;button.onclick=()=>{const mode=`print-cue-${lang}`,cleanup=()=>document.body.classList.remove(mode);document.body.classList.add(mode);window.addEventListener('afterprint',cleanup,{once:true});window.print();};buttons.insertBefore(button,fullPrint);});};

<script>
/* ===== sync-v1.js (원래 사이트 코드) ===== */

  window.enhanceAssignmentSync=function(root,p){

      syncHint(form,'여기서 변경한 내·외부 총괄과 기술팀 담당자는 각 파트 화면에도 동일하게 반영됩니다.');

function migrateRequestedContent(p){if(!p)return;let changed=false;const worship=p.teams.worship,audio=p.teams.audio,video=p.teams.video,caption=p.teams.caption;

  if(worship.options?.includes('외부 예배팀')){worship.options=worship.options.filter(v=>v!=='외부 예배팀');changed=true;}
  const oldWorship='사용한 악기와 보면대를 원래 위치로 정리합니다.';if(worship.restore?.includes(oldWorship)){worship.restore=worship.restore.map(v=>v===oldWorship?'사용한 악기와 기물들은 원래 위치로 정리합니다.':v);changed=true;}
  const oldAudio=audio.restore||[];audio.restore=clean(oldAudio,teams.audio.restore);if(oldAudio.length!==audio.restore.length)changed=true;
  const oldVideo=video.options||[],mappedVideo=oldVideo.map(v=>['외부 업체','외부 영상업체'].includes(v)?'촬영 업체':v);video.options=[...new Set(clean(mappedVideo,teams.video.options))];if(JSON.stringify(oldVideo)!==JSON.stringify(video.options))changed=true;
  const oldCaption=caption.restore||[];caption.restore=oldCaption.map(v=>v.includes('전달받은 자막·사진·영상 파일')?'전달받은 파일을 정리합니다.':v);if(JSON.stringify(oldCaption)!==JSON.stringify(caption.restore))changed=true;
  Object.keys(teamGuidelines).forEach(key=>{const d=p.teams[key];['guidePrep','guideExternal','guidePolicy'].forEach((field,i)=>{const allowed=teamGuidelines[key][['prep','external','policy'][i]],old=d[field]||[],next=clean(old,allowed);if(next.length!==old.length){d[field]=next;changed=true;}});});
  if(changed)localStorage.setItem(PROJECT_KEY,JSON.stringify(p));
}

  async function api(path,options={}){const response=await fetch(path,{...options,headers:{'content-type':'application/json',...(options.headers||{})}});let data={};try{data=await response.json();}catch{}if(!response.ok){const error=new Error(data.error||'요청을 처리하지 못했습니다.');error.status=response.status;error.data=data;throw error;}return data;}

  window.collaborationCanViewSharing=()=>true;

  window.renderSharing=function(p){const view=document.getElementById('view');if(!sharedSession){view.innerHTML=`<section class="card panel share-convert"><div class="panel-head"><div><p class="eyebrow">SHARED PROJECT</p><h2>공동작성 프로젝트로 전환</h2><p>현재 브라우저에만 저장된 프로젝트입니다. 전환하면 누구나 같은 링크로 전체 내용을 보고 수정할 수 있습니다.</p></div></div><div class="share-notice"><strong>하나의 공유 링크로 함께 작성합니다.</strong><p>전체 PD, 교역자, 운영 담당자와 각 기술팀 모두 동일한 프로젝트를 열어 필요한 내용을 바로 수정할 수 있습니다.</p></div><button class="primary-btn" id="convertShared" type="button">공동작성 시작하기</button></section>`;document.getElementById('convertShared').onclick=()=>convertProject(p);return;}
    const url=shareUrl(sharedSession.token);view.innerHTML=`<section class="card panel"><div class="panel-head"><div><p class="eyebrow">PROJECT SHARE LINK</p><h2>프로젝트 공유 링크</h2><p>이 링크 하나로 모든 담당자가 프로젝트 전체를 보고 수정할 수 있습니다.</p></div><span class="status confirmed">공동작성 중</span></div><div class="share-security"><strong>링크를 받은 사람은 누구나 수정할 수 있습니다.</strong><p>신랑·신부, 교역자, 전체 PD와 각 담당자에게 같은 링크를 전달하세요. 잘못 전달한 경우 새 링크를 발급하면 이전 링크는 사용할 수 없습니다.</p></div><div class="single-share-card"><label for="projectShareUrl">공유 링크</label><div class="share-link-row"><input id="projectShareUrl" value="${esc(url)}" readonly><button class="primary-btn" id="copyProjectShare" type="button">링크 복사</button></div><button class="ghost-share" id="renewProjectShare" type="button">새 공유 링크 발급</button></div></section>`;
    document.getElementById('copyProjectShare').onclick=async()=>{await navigator.clipboard.writeText(url);showToast('프로젝트 공유 링크를 복사했습니다.');};
    document.getElementById('renewProjectShare').onclick=()=>renewInvite();
  };

  async function renewInvite(){if(!sharedSession||!confirm('현재 공유 링크를 만료하고 새 링크를 발급할까요?'))return;const button=document.getElementById('renewProjectShare');button.disabled=true;button.textContent='발급 중…';try{const invite=await api(`/api/session/${encodeURIComponent(sharedSession.token)}/invites`,{method:'POST',body:'{}'});sharedSession.token=invite.token;sessionStorage.setItem(TOKEN_KEY,invite.token);render();showToast('새 공유 링크를 발급했습니다.');}catch(error){button.disabled=false;button.textContent='새 공유 링크 발급';showToast(error.message);}}

  async function convertProject(p){const button=document.getElementById('convertShared');if(button){button.disabled=true;button.textContent='공동 프로젝트 생성 중…';}try{const data=await api('/api/projects',{method:'POST',body:JSON.stringify({project:p})});activateSession(data,data.token);currentView='sharing';render();showToast('공동작성 프로젝트를 만들었습니다.');}catch(error){if(button){button.disabled=false;button.textContent='공동작성 시작하기';}showToast(error.message);}}

  function activateSession(data,token){sharedSession={token,version:Number(data.version),updatedAt:data.updatedAt||'',projectId:data.project.id};sessionStorage.setItem(TOKEN_KEY,token);sessionStorage.removeItem('tlc-wedding-share-token-v1');currentRole='pd';localStorage.setItem(PROJECT_KEY,JSON.stringify(data.project));}

  async function loadSession(token,fromUrl=false){app.innerHTML='<section class="card collab-loading"><span class="loading-mark"></span><h2>공동작성 프로젝트를 불러오는 중입니다</h2><p>최신 저장 내용을 확인하고 있습니다.</p></section>';try{const data=await api(`/api/session/${encodeURIComponent(token)}`);activateSession(data,token);if(fromUrl)history.replaceState({},'',`${location.pathname}${location.hash}`);render();startPolling();}catch(error){sessionStorage.removeItem(TOKEN_KEY);sharedSession=null;render();showToast(error.message);}}

  async function pushProject(snapshot,summary,retry=true){if(!sharedSession)return;syncBusy=true;setSyncState('공동 저장 중…','saving');try{const data=await api(`/api/session/${encodeURIComponent(sharedSession.token)}`,{method:'PUT',body:JSON.stringify({project:snapshot,version:sharedSession.version,summary})});sharedSession.version=Number(data.version);sharedSession.updatedAt=data.updatedAt||sharedSession.updatedAt;setSyncState('공동 저장됨');}
    catch(error){if(error.status===409&&error.data?.version&&retry){sharedSession.version=Number(error.data.version);return pushProject(snapshot,summary,false);}setSyncState('저장 확인 필요','error');showToast(error.message);throw error;}
    finally{syncBusy=false;}}

  function startPolling(){if(pollingStarted)return;pollingStarted=true;setInterval(async()=>{if(!sharedSession||syncBusy||document.hidden)return;try{const data=await api(`/api/session/${encodeURIComponent(sharedSession.token)}`);if(Number(data.version)>sharedSession.version){activateSession(data,sharedSession.token);render();showToast('다른 사용자의 최신 변경을 반영했습니다.');}}catch{}},12000);}

  const baseSaveProject=saveProject;
  saveProject=function(p,message){baseSaveProject(p,message);if(!sharedSession)return;const snapshot=clone(p);syncChain=syncChain.then(()=>pushProject(snapshot,message||'프로젝트 내용 저장')).catch(()=>{});};

  const baseCreateProject=createProject;
  createProject=function(data){baseCreateProject(data);const p=getProject();if(p)convertProject(p);};

  function simplifyPermissionCopy(root){const replacements=new Map([['공유 및 권한','프로젝트 공유'],['본인 팀만','전체 공동 편집'],['각 팀 역할에서는 공통 정보를 확인하고 본인 팀 내용만 작성할 수 있습니다.','모든 담당자가 공통 정보와 각 팀의 준비 내용을 함께 확인하고 수정할 수 있습니다.'],['각 팀은 지정된 본인 팀 내용만 수정합니다.','각 팀 담당자를 지정하고 모든 준비 내용을 함께 관리합니다.'],['다른 기술팀의 내용은 수정할 수 없습니다.','모든 기술팀 내용을 함께 수정할 수 있습니다.'],['다른 전문팀의 내용은 수정할 수 없습니다.','모든 기술팀 내용을 함께 수정할 수 있습니다.']]);const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){const next=replacements.get(node.nodeValue.trim());if(next)node.nodeValue=node.nodeValue.replace(node.nodeValue.trim(),next);}}

  function enhanceCollaboration(root,p){const reset=document.getElementById('resetProject'),admin=document.getElementById('copyToggle');if(!p){const privacy=root.querySelector('.privacy-note');if(privacy)privacy.textContent='제출하면 하나의 공동작성 프로젝트와 공유 링크가 생성됩니다. 링크를 받은 사람은 누구나 전체 내용을 보고 수정할 수 있습니다.';return;}if(sharedSession){setSyncState('공동 저장됨');admin?.classList.remove('hidden');if(reset){reset.textContent='공유 프로젝트 닫기';reset.onclick=()=>{if(!confirm('이 기기에서 공유 프로젝트를 닫을까요? 공동 저장된 프로젝트는 삭제되지 않습니다.'))return;sessionStorage.removeItem(TOKEN_KEY);sessionStorage.removeItem('tlc-wedding-share-token-v1');sharedSession=null;localStorage.removeItem(PROJECT_KEY);currentView='overview';currentRole='pd';render();showToast('공유 프로젝트를 닫았습니다.');};}const hero=document.querySelector('.project-hero');if(hero&&!hero.nextElementSibling?.classList.contains('collab-role-banner'))hero.insertAdjacentHTML('afterend','<div class="collab-role-banner"><strong>공동 편집</strong><span>링크를 가진 모든 사용자가 전체 내용을 보고 수정할 수 있습니다.</span></div>');}else{admin?.classList.remove('hidden');const sync=document.querySelector('.project-hero .sync-pill');if(sync)sync.textContent='이 브라우저에만 저장됨';}simplifyPermissionCopy(root);}

  const baseEnhanceCollaboration=enhanceCollaboration;
  enhanceCollaboration=function(root,p){baseEnhanceCollaboration(root,p);document.getElementById('copyToggle')?.classList.toggle('hidden',!adminMode);};

  const baseRender=render;
  render=function(){baseRender();enhanceCollaboration(app,getProject());};

  const params=new URLSearchParams(location.search),adminMode=params.get('admin')==='1',urlToken=params.get('share'),savedToken=sessionStorage.getItem(TOKEN_KEY)||sessionStorage.getItem('tlc-wedding-share-token-v1');
  if(urlToken||savedToken)loadSession(urlToken||savedToken,Boolean(urlToken)).then(()=>{if(adminMode&&typeof renderAdminPageV2==='function')renderAdminPageV2();});else{render();if(adminMode&&typeof renderAdminPageV2==='function')renderAdminPageV2();}
})();

</script>

D 진행 단계"},{"group":"Part 2 · 전체 현황","text":"주례 확인"},{"group":"Part 2 · 전체 현황","text":"주례 확정 처리"},{"group":"Part 2 · 전체 현황","text":"주례 확정 취소"},{"group":"Part 2 · 전체 현황","text":"주례 확정부터 최종 잠금까지 순서대로 진행합니다."},{"group":"Part 2 · 전체 현황","text":"준비 중"},{"group":"Part 2 · 전체 현황","text":"최종 완료"},{"group":"Part 2 · 전체 현황","text":"최종 확정 및 잠금"},{"group":"Part 2 · 전체 현황","text":"최종 확정 준비"},{"group":"Part 2 · 전체 현황","text":"통합 문서 미리보기"},{"group":"Part 2 · 전체 현황","text":"통합 문서 보기"},{"group":"Part 2 · 전체 현황","text":"팀 확인"},{"group":"Part 2 · 전체 현황","text":"현재 단계"},{"group":"Part 2 · 전체 현황","text":"확정 해제"},{"group":"Part 2 · 전체 현황","text":"OPERATIONS"},{"group":"Part 2 · 층별 총괄","text":"각 층의 사용 공간, 담당자, 방문객 동선과 예식 후 정리·원상복구를 관리합니다."},{"group":"Part 2 · 층별 총괄","text":"각 층의 사용 공간, 담당자, 방문객 동선과 원상복구를 관리합니다."},{"group":"Part 2 · 층별 총괄","text":"담당 공간"},{"group":"Part 2 · 층별 총괄","text":"동선·비품·이동 수량·특이사항"},{"group":"Part 2 · 층별 총괄","text":"동선·비품·특이사항"},{"group":"Part 2 · 층별 총괄","text":"복귀 수량, 미복구 물품 또는 인계 내용을 적어주세요."},{"group":"Part 2 · 층별 총괄","text":"예: 라운지, 대기실, 예식장"},{"group":"Part 2 · 층별 총괄","text":"예식 후 정리·원상복구 확인"},{"group":"Part 2 · 층별 총괄","text":"의자·비품·안내물·대기실을 예식 전 상태로 복구합니다."},{"group":"Part 2 · 층별 총괄","text":"장소사용 신청 내용과 함께 확인합니다."},{"group":"Part 2 · 층별 총괄","text":"장소사용 신청과 이동 물품 수량을 함께 대조합니다."},{"group":"Part 2 · 층별 총괄","text":"전체 PD·내부 진행 총괄·층별 총괄만 수정할 수 있습니다."},{"group":"Part 2 · 층별 총괄","text":"총괄 담당자"},{"group":"Part 2 · 층별 총괄","text":"층간 이동한 의자와 물품의 종류·수량도 기록합니다."},{"group":"Part 2 · 층별 총괄","text":"층별 담당 저장"},{"group":"Part 2 · 층별 총괄","text":"층별 담당과 원상복구를 저장했습니다."},{"group":"Part 2 · 층별 총괄","text":"층별 담당을 저장했습니다."},{"group":"Part 2 · 층별 총괄","text":"층별 총괄 담당자와 공간이 저장되었습니다."},{"group":"Part 2 · 층별 총괄","text":"층별 총괄과 예식 후 원상복구 내용이 저장되었습니다."}];

<script>
/* ===== content-admin-v3.js (원래 사이트 코드) ===== */
(function(){
  const catalog=Array.isArray(window.TLC_COPY_CATALOG)?window.TLC_COPY_CATALOG:[];
  const adminMode=new URLSearchParams(location.search).get('admin')==='1';
  const previewMode=new URLSearchParams(location.search).get('previewAdmin')==='1';
  const ADMIN_KEY='tlc-wedding-admin-content-v1';
  const BRANDING_KEY='tlc-wedding-brand-v1';
  let siteContent={overrides:{},adminContent:null,branding:null};
  let siteContentVersion=0;
  let contentReady=false;
  let adminAuthenticated=false;

  function translated(value){
    const key=String(value||'').replace(/\s+/g,' ').trim();
    return Object.prototype.hasOwnProperty.call(siteContent.overrides||{},key)?siteContent.overrides[key]:value;
  }

  function applyTextOverrides(root=document){
    if(!contentReady)return;
    const overrides=siteContent.overrides||{};
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    let node;
    while(node=walker.nextNode()){
      const parent=node.parentElement;
      if(!parent||parent.closest('.admin-page,script,style,textarea'))continue;
      const raw=node.nodeValue,key=raw.replace(/\s+/g,' ').trim();
      if(!key||!Object.prototype.hasOwnProperty.call(overrides,key))continue;
      const start=raw.match(/^\s*/)?.[0]||'',end=raw.match(/\s*$/)?.[0]||'';
      node.nodeValue=start+overrides[key]+end;
    }
    root.querySelectorAll?.('[placeholder],[title],[aria-label]').forEach(element=>{
      ['placeholder','title','aria-label'].forEach(attribute=>{
        if(!element.hasAttribute(attribute)||element.closest('.admin-page'))return;
        const value=element.getAttribute(attribute);
        if(Object.prototype.hasOwnProperty.call(overrides,value))element.setAttribute(attribute,overrides[value]);
      });
    });
    const title='결혼예식 프로젝트 | 주님의교회';
    if(Object.prototype.hasOwnProperty.call(overrides,title))document.title=overrides[title];
    const meta=document.querySelector('meta[name="description"]');
    if(meta&&Object.prototype.hasOwnProperty.call(overrides,meta.content))meta.content=overrides[meta.content];
  }

  async function contentApi(path,options={}){
    const response=await fetch(path,{credentials:'same-origin',...options,headers:{'content-type':'application/json',...(options.headers||{})}});
    let data={};
    try{data=await response.json();}catch{}
    if(!response.ok){const error=new Error(data.error||'공용 설정을 처리하지 못했습니다.');error.status=response.status;error.data=data;throw error;}
    return data;
  }

  function renderAdminLogin(message=''){
    document.body.classList.remove('copy-mode');
    document.getElementById('copyToggle')?.classList.add('hidden');
    document.getElementById('resetProject')?.classList.add('hidden');
    app.innerHTML=`<section class="card admin-login"><div class="admin-login-mark">†</div><p class="eyebrow">ADMIN</p><h1>관리자 로그인</h1><p>관리자 설정을 열려면 비밀번호를 입력해 주세요.</p><form id="adminLoginForm"><label class="field"><span>비밀번호</span><input id="adminPassword" name="password" type="password" autocomplete="current-password" required autofocus></label>${message?`<p class="admin-login-error" role="alert">${esc(message)}</p>`:''}<button class="primary-btn" type="submit">관리자 설정 열기</button></form><a class="admin-home-link" href="${location.pathname}">신청 페이지로 돌아가기</a></section>`;
    const form=document.getElementById('adminLoginForm');
    form.onsubmit=async event=>{
      event.preventDefault();
      const button=form.querySelector('button');
      button.disabled=true;button.textContent='확인 중…';
      try{
        await contentApi('/api/admin/login',{method:'POST',body:JSON.stringify({password:new FormData(form).get('password')||''})});
        adminAuthenticated=true;
        renderAdminPageV2();
      }catch(error){
        renderAdminLogin(error.status===401?'비밀번호가 올바르지 않습니다. 다시 확인해 주세요.':'로그인에 실패했습니다. 잠시 후 다시 시도해 주세요.');
      }
    };
  }

  async function checkAdminSession(){
    try{const data=await contentApi('/api/admin/session');return data.authenticated===true;}catch{return false;}
  }

  async function logoutAdmin(){
    try{await contentApi('/api/admin/logout',{method:'POST',body:'{}'});}catch{}
    adminAuthenticated=false;
    renderAdminLogin();
  }

  function hydrateStructuredContent(){
    if(siteContent.adminContent){
      localStorage.setItem(ADMIN_KEY,JSON.stringify(siteContent.adminContent));
      if(typeof applyAdminContent==='function')applyAdminContent(siteContent.adminContent);
    }
    if(siteContent.branding)localStorage.setItem(BRANDING_KEY,JSON.stringify(siteContent.branding));
  }

  async function loadSiteContent(){
    try{
      const data=await contentApi('/api/site-content');
      siteContentVersion=Number(data.version||0);
      siteContent={overrides:{},adminContent:null,branding:null,...(data.content||{})};
      hydrateStructuredContent();
    }catch(error){
      if(adminMode)showToast('공용 설정을 불러오지 못해 이 기기의 설정을 표시합니다.');
    }finally{
      contentReady=true;
    }
  }

  async function saveSiteContent(next){
    const data=await contentApi('/api/site-content',{method:'PUT',body:JSON.stringify({version:siteContentVersion,content:next})});
    siteContentVersion=Number(data.version||siteContentVersion+1);
    siteContent={overrides:{},adminContent:null,branding:null,...data.content};
    hydrateStructuredContent();
    return siteContent;
  }

  function copyField(entry){
    const value=Object.prototype.hasOwnProperty.call(siteContent.overrides||{},entry.text)?siteContent.overrides[entry.text]:entry.text;
    const control=value.length>90
      ?`<textarea data-full-copy data-original="${esc(entry.text)}">${esc(value)}</textarea>`
      :`<input data-full-copy data-original="${esc(entry.text)}" value="${esc(value)}">`;
    return `<label class="admin-field full-copy-field"><span>${esc(entry.text)}</span>${control}<small>비워두면 해당 문구가 화면에서 숨겨집니다.</small></label>`;
  }

  function copyEditorSection(){
    const groups=new Map();
    catalog.forEach(entry=>{if(!groups.has(entry.group))groups.set(entry.group,[]);groups.get(entry.group).push(entry);});
    return `<section class="admin-section full-copy-admin"><div class="admin-section-heading"><div><p class="eyebrow">ALL PAGE COPY</p><h2>화면별 전체 문구</h2><p>제목, 소제목, 본문, 버튼, 상태 문구, 입력 예시와 안내문을 화면별로 수정합니다.</p></div><span class="copy-count">${catalog.length}개 문구</span></div><label class="admin-copy-search"><span>문구 검색</span><input id="adminCopySearch" type="search" placeholder="수정할 문구를 검색하세요"></label><div class="admin-copy-groups">${[...groups.entries()].map(([group,entries],index)=>`<details class="admin-copy-group" ${index===0?'open':''}><summary><span>${esc(group)}</span><small>${entries.length}개</small></summary><div class="admin-copy-fields">${entries.map(copyField).join('')}</div></details>`).join('')}</div></section>`;
  }

  function collectOverrides(form){
    const next={};
    form.querySelectorAll('[data-full-copy]').forEach(field=>{
      const original=field.dataset.original,value=field.value;
      if(value!==original)next[original]=value;
    });
    return next;
  }

  function bindCopySearch(){
    const search=document.getElementById('adminCopySearch');
    if(!search)return;
    search.addEventListener('input',()=>{
      const keyword=search.value.trim().toLocaleLowerCase('ko');
      document.querySelectorAll('.admin-copy-group').forEach(group=>{
        let visible=0;
        group.querySelectorAll('.full-copy-field').forEach(field=>{
          const match=!keyword||field.textContent.toLocaleLowerCase('ko').includes(keyword)||field.querySelector('input,textarea')?.value.toLocaleLowerCase('ko').includes(keyword);
          field.classList.toggle('hidden',!match);
          if(match)visible+=1;
        });
        group.classList.toggle('hidden',visible===0);
        if(keyword&&visible)group.open=true;
      });
    });
  }

  const baseRender=render;
  render=function(){baseRender();applyTextOverrides(document);};

  const baseShowToast=showToast;
  showToast=function(message){baseShowToast(translated(message));};

  const baseConfirm=window.confirm.bind(window);
  window.confirm=message=>baseConfirm(translated(message));

  const baseRenderAdmin=renderAdminPageV2;
  renderAdminPageV2=function(){
    if(adminMode&&!adminAuthenticated){renderAdminLogin();return;}
    baseRenderAdmin();
    const form=document.getElementById('adminContentForm');
    if(!form)return;
    const page=app.querySelector('.admin-page');
    const heading=page?.querySelector('.panel-head h1');
    const intro=page?.querySelector('.panel-head p:not(.eyebrow)');
    if(heading)heading.textContent='관리자 전체 설정';
    if(intro)intro.textContent='화면 구성과 브랜드뿐 아니라 사이트에 표시되는 모든 문구를 화면별로 수정합니다.';
    page?.querySelector('.panel-head')?.insertAdjacentHTML('beforeend','<button class="secondary-btn admin-logout" id="adminLogout" type="button">로그아웃</button>');
    document.getElementById('adminLogout').onclick=logoutAdmin;
    form.querySelector('.admin-actions')?.insertAdjacentHTML('beforebegin',copyEditorSection());
    bindCopySearch();
    const originalSubmit=form.onsubmit;
    form.onsubmit=async event=>{
      event.preventDefault();
      const overrides=collectOverrides(form);
      originalSubmit?.(event);
      const next={
        overrides,
        adminContent:readAdminContent()||snapshotAdminContent(),
        branding:getBranding()
      };
      try{
        await saveSiteContent(next);
        showToast('전체 관리자 설정을 모든 사용자에게 반영했습니다.');
      }catch(error){
        if(error.status===401){adminAuthenticated=false;renderAdminLogin('로그인 시간이 만료되었습니다. 다시 로그인해 주세요.');return;}
        showToast(error.status===409?'다른 관리자의 최신 설정을 다시 불러온 뒤 저장해 주세요.':'공용 설정 저장에 실패했습니다. 이 기기에는 임시 저장되었습니다.');
      }
    };
    const reset=document.getElementById('adminReset');
    if(reset)reset.onclick=async()=>{
      if(!baseConfirm('관리자에서 수정한 모든 문구와 화면 구성을 기본값으로 되돌릴까요?'))return;
      localStorage.removeItem(ADMIN_KEY);
      applyAdminContent(ADMIN_DEFAULTS);
      const next={overrides:{},adminContent:snapshotAdminContent(),branding:getBranding()};
      try{
        await saveSiteContent(next);
        const project=getProject();
        if(project)syncProjectFloors(project);
        renderAdminPageV2();
        showToast('모든 화면 문구와 구성을 기본값으로 초기화했습니다.');
      }catch(error){
        showToast('공용 설정 초기화에 실패했습니다.');
      }
    };
  };

  (async()=>{
    if(previewMode)return;
    await loadSiteContent();
    render();
    if(adminMode){
      adminAuthenticated=await checkAdminSession();
      if(adminAuthenticated)renderAdminPageV2();else renderAdminLogin();
    }
  })();
})();
