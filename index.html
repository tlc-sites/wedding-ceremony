<script>
/* ===== visual-admin-v1.js (원래 사이트 코드) ===== */
(function(){
  const params=new URLSearchParams(location.search);
  const isAdmin=params.get('admin')==='1';
  const isPreview=params.get('previewAdmin')==='1';
  if(!isAdmin&&!isPreview)return;

  const pageOptions=[
    ['part1','Part 1 · 신청 시작'],['overview','전체 현황'],['shared','공통 정보'],['organization','전체 총괄'],
    ['internal','내부 진행'],['external','외부 진행'],['floors','층별 총괄'],['places','장소사용 신청'],
    ['worship','예배팀'],['audio','음향팀'],['video','영상팀'],['caption','자막팀'],['photo','사진팀'],['lighting','조명팀'],
    ['document','통합 문서'],['history','변경 기록']
  ];
  const catalog=Array.isArray(window.TLC_COPY_CATALOG)?window.TLC_COPY_CATALOG:[];
  const byNormalized=new Map(catalog.map(entry=>[normalize(entry.text),entry.text]));
  let previewOverrides={};

  function normalize(value){return String(value||'').replace(/\s+/g,' ').trim();}
  function cloneValue(value){return JSON.parse(JSON.stringify(value));}
  function parseLines(value){return String(value||'').split('\n').map(item=>item.trim()).filter(Boolean);}
  function api(path,options={}){return fetch(path,{credentials:'same-origin',...options,headers:{'content-type':'application/json',...(options.headers||{})}}).then(async response=>{let data={};try{data=await response.json();}catch{}if(!response.ok){const error=new Error(data.error||'요청을 처리하지 못했습니다.');error.status=response.status;error.data=data;throw error;}return data;});}

  function previewProject(){
    const cueRowsKo=typeof cueSequencesKo!=='undefined'?cueSequencesKo.slice(0,6).map(emptyCueRow):[];
    const cueRowsEn=typeof cueSequencesEn!=='undefined'?cueSequencesEn.slice(0,6).map(emptyCueRow):[];
    const project={
      id:'ADMIN-PREVIEW',groom:'신랑',bride:'신부',groomChurch:'주님의교회',brideChurch:'주님의교회',groomPhone:'010-0000-0000',bridePhone:'010-0000-0000',
      groomStory:'신랑 이야기가 표시됩니다.',brideStory:'신부 이야기가 표시됩니다.',candidateDate1:'2026-10-10T14:00',candidateDate2:'',candidateDate3:'',officiantDuration:'',
      date:'2026-10-10',time:'14:00',endTime:'15:30',venue:'대예배실',status:'준비 중',officiantConfirmed:true,meeting1:true,meeting2:false,finalized:false,finalizedAt:'',
      rehearsal:'2026-10-10T12:00',nextSchedule:'',orderOfService:'',organization:organizationDefault(),internalOps:statusDefault(),externalOps:statusDefault(),
      placeRequest:placeDefault(),equipmentRequest:equipmentDefault(),teams:teamDefaults(),activity:[{at:'오늘',text:'관리자 미리보기 변경 기록입니다.'}],updatedAt:'오늘',
      mcName:'사회자',mcPhone:'010-0000-0000',mcRelation:'담당자',cueRowsKo,cueRowsEn,cueAttachment:null
    };
    project.organization.pdName='전체 PD';project.organization.internalName='내부 총괄';project.organization.externalName='외부 총괄';
    project.organization.floors.forEach((floor,index)=>{floor.name=`${index+1}층 담당자`;floor.spaces='담당 공간';});
    Object.entries(project.teams).forEach(([key,team])=>{team.lead=`${teams[key].name} 담당자`;team.phone='010-0000-0000';team.guidePrep=[];team.guideExternal=[];team.guidePolicy=[];team.nextChurchSchedule='';team.cleanupDeadline='';team.guideNotes='';});
    project.teams.worship.personnel=worshipPeopleDefault();project.teams.worship.songPersonnel=songPeopleDefault();project.teams.worship.instrumentalPersonnel=instrumentalPeopleDefault();
    project.teams.video.videoRequests=[];project.teams.video.videoEquipment=[];project.teams.video.videoDeliverables=[];
    project.equipmentRequest.audioGearNotes='';project.equipmentRequest.captionFileNotes='';
    return project;
  }

  async function installPreview(){
    document.body.classList.add('visual-admin-preview');
    let draft=null;try{draft=JSON.parse(sessionStorage.getItem('tlc-visual-admin-draft')||'null');}catch{}
    const data=draft?{content:draft}:await api('/api/site-content').catch(()=>({content:{overrides:{}}}));
    previewOverrides=data.content?.overrides||{};
    if(data.content?.adminContent){localStorage.setItem(ADMIN_CONTENT_KEY,JSON.stringify(data.content.adminContent));applyAdminContent(data.content.adminContent);}
    if(data.content?.branding){localStorage.setItem(BRAND_KEY,JSON.stringify(data.content.branding));applyBranding(data.content.branding);}
    const reverse=new Map(Object.entries(previewOverrides).map(([key,value])=>[normalize(value),key]));
    const project=previewProject();
    window.getProject=()=>params.get('page')==='part1'?null:project;
    window.saveProject=()=>{};
    currentRole='pd';currentView=params.get('page')||'part1';
    render();

    const candidates='h1,h2,h3,h4,p,button,summary,strong,small,th,td,.eyebrow,.status,.nav-label,label>span,input[placeholder],textarea[placeholder]';
    function mark(){
      document.querySelectorAll(candidates).forEach(element=>{
        if(element.closest('.visual-admin-hint'))return;
        const attribute=(element.matches('input,textarea')&&element.hasAttribute('placeholder'))?'placeholder':'';
        const value=attribute?element.getAttribute(attribute):normalize(element.textContent);
        const original=byNormalized.get(normalize(value))||reverse.get(normalize(value));
        if(!original)return;
        element.dataset.visualKey=original;
        element.dataset.visualAttribute=attribute;
        element.classList.add('visual-editable');
      });
      const walker=document.createTreeWalker(app,NodeFilter.SHOW_TEXT);let node;
      while(node=walker.nextNode()){
        const parentElement=node.parentElement;if(!parentElement||parentElement.closest('script,style,textarea'))continue;
        const raw=node.nodeValue,key=byNormalized.get(normalize(raw));if(!key||!Object.prototype.hasOwnProperty.call(previewOverrides,key))continue;
        parentElement.dataset.visualKey=key;parentElement.classList.add('visual-editable');
        const start=raw.match(/^\s*/)?.[0]||'',end=raw.match(/\s*$/)?.[0]||'';node.nodeValue=start+previewOverrides[key]+end;
      }
      document.querySelectorAll('[placeholder]').forEach(element=>{const value=element.getAttribute('placeholder'),key=byNormalized.get(normalize(value));if(!key||!Object.prototype.hasOwnProperty.call(previewOverrides,key))return;element.dataset.visualKey=key;element.dataset.visualAttribute='placeholder';element.classList.add('visual-editable');element.setAttribute('placeholder',previewOverrides[key]);});
    }
    mark();
    new MutationObserver(mark).observe(app,{childList:true,subtree:true});
    document.addEventListener('click',event=>{
      const target=event.target.closest('[data-visual-key]');
      event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();
      if(!target)return;
      document.querySelectorAll('.visual-selected').forEach(item=>item.classList.remove('visual-selected'));
      target.classList.add('visual-selected');
      parent.postMessage({type:'tlc-visual-edit',key:target.dataset.visualKey,attribute:target.dataset.visualAttribute||'',value:previewOverrides[target.dataset.visualKey]??target.dataset.visualKey},location.origin);
    },true);
    parent.postMessage({type:'tlc-visual-ready'},location.origin);
  }

  if(isPreview){installPreview();return;}

  let content=null;
  let version=0;
  let selectedPage='part1';
  let dirty=false;
  let selectedKey='';
  let draftLogo='';
  const originalAdminRenderer=window.renderAdminPageV2;

  function normalizeBranding(value={}){const defaults=getBranding(),saved={...value};const legacy=(!saved.primary||saved.primary==='#173b35')&&(!saved.secondary||saved.secondary==='#245a50')&&(!saved.accent||saved.accent==='#b8873f')&&(!saved.canvas||saved.canvas==='#eff4f1');const result={...defaults,...saved,...(legacy?{primary:defaults.primary,secondary:defaults.secondary,accent:defaults.accent,canvas:defaults.canvas}:{})};if(!result.logo)result.logo=defaults.logo;if(!result.favicon)result.favicon=result.logo;return result;}
  function defaultContent(){return {overrides:{},adminContent:typeof snapshotAdminContent==='function'?snapshotAdminContent():null,branding:getBranding()};}
  function ensureContent(data){content={...defaultContent(),...(data?.content||{})};content.overrides=content.overrides||{};content.adminContent=content.adminContent||snapshotAdminContent();content.adminContent.places=content.adminContent.places||cloneValue(placeNames);content.branding=normalizeBranding(content.branding||{});version=Number(data?.version||0);draftLogo=content.branding.logo||content.branding.favicon||'';}
  function syncDraft(){if(content)sessionStorage.setItem('tlc-visual-admin-draft',JSON.stringify(content));}
  function setDirty(value=true){dirty=value;const badge=document.getElementById('visualSaveState');if(badge){badge.textContent=dirty?'저장하지 않은 변경':'모든 변경 저장됨';badge.classList.toggle('is-dirty',dirty);}const button=document.getElementById('visualSave');if(button)button.disabled=!dirty;}
  function previewUrl(){return `${location.pathname}?previewAdmin=1&page=${encodeURIComponent(selectedPage)}&v=${Date.now()}`;}
  function reloadPreview(){syncDraft();const frame=document.getElementById('visualPreview');if(frame)frame.src=previewUrl();}
  function closeDrawer(){document.getElementById('visualDrawer')?.classList.remove('open');selectedKey='';}

  function shell(){
    app.innerHTML=`<section class="visual-admin-studio"><header class="visual-admin-toolbar"><div class="visual-admin-title"><span class="visual-admin-symbol">✦</span><div><strong>화면 직접 편집</strong><small id="visualSaveState">모든 변경 저장됨</small></div></div><label class="visual-page-select"><span>편집 화면</span><select id="visualPage">${pageOptions.map(([key,label])=>`<option value="${key}" ${selectedPage===key?'selected':''}>${label}</option>`).join('')}</select></label><div class="visual-view-switch" aria-label="미리보기 크기"><button class="active" type="button" data-viewport="desktop">PC</button><button type="button" data-viewport="mobile">모바일</button></div><div class="visual-toolbar-actions"><button class="secondary-btn" id="visualStructure" type="button">구조·항목</button><button class="secondary-btn" id="visualBrand" type="button">색상·로고</button><button class="secondary-btn" id="visualHidden" type="button">숨긴 문구</button><button class="primary-btn" id="visualSave" type="button" disabled>변경사항 저장</button><button class="secondary-btn" id="visualLogout" type="button">로그아웃</button></div></header><div class="visual-admin-help"><span>편집할 제목·설명·버튼을 화면에서 클릭하세요.</span><a href="${location.pathname}" target="_blank" rel="noopener">신청자 화면 열기</a></div><div class="visual-preview-wrap" id="visualPreviewWrap"><iframe id="visualPreview" title="신청 페이지 관리자 미리보기" src="${previewUrl()}"></iframe></div><aside class="visual-drawer" id="visualDrawer" aria-label="편집 도구"><div class="visual-drawer-head"><div><p class="eyebrow">EDIT</p><h2 id="visualDrawerTitle">문구 수정</h2></div><button class="visual-close" id="visualDrawerClose" type="button" aria-label="닫기">×</button></div><div id="visualDrawerBody"></div></aside></section>`;
    document.getElementById('copyToggle')?.classList.add('hidden');document.getElementById('resetProject')?.classList.add('hidden');
    bindShell();setDirty(dirty);
  }

  async function renderVisualAdmin(){
    app.innerHTML='<section class="card collab-loading"><span class="loading-mark"></span><h2>관리자 편집기를 준비하고 있습니다</h2><p>실제 신청 화면과 저장된 설정을 불러오는 중입니다.</p></section>';
    try{if(!content){const data=await api('/api/site-content');ensureContent(data);syncDraft();}shell();}catch(error){if(error.status===401){location.reload();return;}app.innerHTML='<section class="card panel"><h2>관리자 설정을 불러오지 못했습니다.</h2><p>잠시 후 다시 시도해 주세요.</p></section>';}
  }

  function bindShell(){
    document.getElementById('visualPage').onchange=event=>{selectedPage=event.target.value;closeDrawer();reloadPreview();};
    document.querySelectorAll('[data-viewport]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-viewport]').forEach(item=>item.classList.toggle('active',item===button));document.getElementById('visualPreviewWrap').classList.toggle('is-mobile',button.dataset.viewport==='mobile');});
    document.getElementById('visualDrawerClose').onclick=closeDrawer;
    document.getElementById('visualStructure').onclick=showStructure;
    document.getElementById('visualBrand').onclick=showBrand;
    document.getElementById('visualHidden').onclick=showHidden;
    document.getElementById('visualSave').onclick=saveAll;
    document.getElementById('visualLogout').onclick=async()=>{if(dirty&&!confirm('저장하지 않은 변경이 있습니다. 로그아웃할까요?'))return;await api('/api/admin/logout',{method:'POST',body:'{}'}).catch(()=>{});location.reload();};
  }

  function openDrawer(title,html){document.getElementById('visualDrawerTitle').textContent=title;document.getElementById('visualDrawerBody').innerHTML=html;document.getElementById('visualDrawer').classList.add('open');}
  function showTextEditor(key){
    selectedKey=key;const current=Object.prototype.hasOwnProperty.call(content.overrides,key)?content.overrides[key]:key;
    openDrawer('문구 수정',`<div class="visual-field"><label>현재 문구</label><textarea id="visualTextValue">${esc(current)}</textarea><small>비워두면 신청 화면에서 문구가 숨겨집니다.</small></div><div class="visual-original"><span>기본 문구</span><p>${esc(key)}</p></div><div class="visual-drawer-actions"><button class="danger-btn" id="visualHideText" type="button">문구 숨기기</button><button class="secondary-btn" id="visualRestoreText" type="button">기본값 복원</button><button class="primary-btn" id="visualApplyText" type="button">화면에 적용</button></div>`);
    document.getElementById('visualApplyText').onclick=()=>applyText(document.getElementById('visualTextValue').value);
    document.getElementById('visualHideText').onclick=()=>applyText('');
    document.getElementById('visualRestoreText').onclick=()=>{delete content.overrides[key];setDirty();closeDrawer();reloadPreview();};
  }
  function applyText(value){if(!selectedKey)return;if(value===selectedKey)delete content.overrides[selectedKey];else content.overrides[selectedKey]=value;setDirty();closeDrawer();reloadPreview();}

  function lineField(label,name,items){return `<label class="visual-field"><span>${label}</span><textarea name="${name}">${esc((items||[]).join('\n'))}</textarea><small>한 줄에 항목 하나씩 입력하세요. 줄 순서대로 화면에 표시됩니다.</small></label>`;}
  function rowEditor(name,items,placeholder){return `<div class="visual-row-list" data-row-list="${name}">${(items||[]).map(item=>`<div class="visual-row"><input name="${name}" value="${esc(item)}"><button class="danger-btn" type="button" data-remove-row>삭제</button></div>`).join('')}</div><button class="secondary-btn visual-add-row" type="button" data-add-row="${name}" data-placeholder="${esc(placeholder)}">항목 추가</button>`;}

  function showStructure(){
    const state=content.adminContent||snapshotAdminContent();
    openDrawer('구조·항목 설정',`<form id="visualStructureForm" class="visual-structure-form"><details open><summary>층별 담당 구성</summary><div class="visual-detail-body"><p>추가하거나 삭제하면 운영조직·층별 총괄·통합 문서에 함께 반영됩니다.</p>${rowEditor('floors',state.floors,'예: 1층')}</div></details><details><summary>장소사용 목록</summary><div class="visual-detail-body"><p>신랑·신부가 선택할 수 있는 교회 공간입니다.</p>${rowEditor('places',state.places||placeNames,'예: 대예배실')}</div></details><details><summary>전체 운영 체크리스트</summary><div class="visual-detail-body">${lineField('전체 PD','pdTasks',state.pdTasks)}${lineField('내부 진행','internalTasks',state.internalTasks)}${lineField('외부 진행','externalTasks',state.externalTasks)}</div></details><details><summary>총괄 역할 안내</summary><div class="visual-detail-body">${Object.entries(state.roleGuides||{}).map(([key,guide])=>`<section class="visual-team-structure"><h3>${esc(guide.title)}</h3><label class="visual-field"><span>역할명</span><input name="role_${key}_title" value="${esc(guide.title)}"></label><label class="visual-field"><span>담당 범위</span><textarea name="role_${key}_scope">${esc(guide.scope)}</textarea></label>${lineField('확인 항목',`role_${key}_items`,guide.items)}</section>`).join('')}</div></details>${Object.entries(state.teams||{}).map(([key,team])=>`<details><summary>${esc(team.name)}</summary><div class="visual-detail-body"><label class="visual-field"><span>팀 이름</span><input name="team_${key}_name" value="${esc(team.name)}"></label><label class="visual-field"><span>소개</span><textarea name="team_${key}_intro">${esc(team.intro)}</textarea></label>${lineField('기본 안내',`team_${key}_provided`,team.provided)}${lineField('기본 사용 항목',`team_${key}_options`,team.options)}<label class="visual-field"><span>협의사항 제목</span><input name="team_${key}_extraLabel" value="${esc(team.extraLabel)}"></label><label class="visual-field"><span>순서별 요청 제목</span><input name="team_${key}_sequenceLabel" value="${esc(team.sequenceLabel)}"></label>${lineField('정리 및 원상복구',`team_${key}_restore`,team.restore)}${lineField('운영 방식 및 사전 확인',`guide_${key}_prep`,state.guidelines?.[key]?.prep)}${lineField('업체·추가 장비 안내',`guide_${key}_external`,state.guidelines?.[key]?.external)}${lineField('장비와 시설 사용 약속',`guide_${key}_policy`,state.guidelines?.[key]?.policy)}</div></details>`).join('')}<button class="primary-btn visual-wide" type="submit">구조 변경 적용</button></form>`);
    bindRowEditors();document.getElementById('visualStructureForm').onsubmit=applyStructure;
  }

  function bindRowEditors(){
    document.querySelectorAll('[data-remove-row]').forEach(button=>button.onclick=()=>button.closest('.visual-row').remove());
    document.querySelectorAll('[data-add-row]').forEach(button=>button.onclick=()=>{const list=document.querySelector(`[data-row-list="${button.dataset.addRow}"]`);list.insertAdjacentHTML('beforeend',`<div class="visual-row"><input name="${button.dataset.addRow}" placeholder="${esc(button.dataset.placeholder)}"><button class="danger-btn" type="button" data-remove-row>삭제</button></div>`);const row=list.lastElementChild;row.querySelector('[data-remove-row]').onclick=()=>row.remove();row.querySelector('input').focus();});
  }

  function applyStructure(event){
    event.preventDefault();const form=event.currentTarget,fd=new FormData(form),state=cloneValue(content.adminContent||snapshotAdminContent());
    state.floors=fd.getAll('floors').map(value=>String(value).trim()).filter(Boolean);state.places=fd.getAll('places').map(value=>String(value).trim()).filter(Boolean);
    ['pdTasks','internalTasks','externalTasks'].forEach(key=>state[key]=parseLines(fd.get(key)));
    Object.keys(state.roleGuides||{}).forEach(key=>{state.roleGuides[key]={title:fd.get(`role_${key}_title`)||'',scope:fd.get(`role_${key}_scope`)||'',items:parseLines(fd.get(`role_${key}_items`))};});
    Object.keys(state.teams||{}).forEach(key=>{const team=state.teams[key];team.name=fd.get(`team_${key}_name`)||'';team.intro=fd.get(`team_${key}_intro`)||'';team.provided=parseLines(fd.get(`team_${key}_provided`));team.options=parseLines(fd.get(`team_${key}_options`));team.extraLabel=fd.get(`team_${key}_extraLabel`)||'';team.sequenceLabel=fd.get(`team_${key}_sequenceLabel`)||'';team.restore=parseLines(fd.get(`team_${key}_restore`));state.guidelines[key]={prep:parseLines(fd.get(`guide_${key}_prep`)),external:parseLines(fd.get(`guide_${key}_external`)),policy:parseLines(fd.get(`guide_${key}_policy`))};});
    content.adminContent=state;setDirty();closeDrawer();reloadPreview();showToast('구조 변경을 미리보기에 적용했습니다. 저장 버튼을 눌러 확정해 주세요.');
  }

  function fileData(input,callback){const file=input.files?.[0];if(!file)return;if(file.size>1500000){showToast('이미지 파일은 1.5MB 이하로 올려주세요.');input.value='';return;}const reader=new FileReader();reader.onload=()=>callback(reader.result);reader.readAsDataURL(file);}
  function showBrand(){
    const brand=content.branding||getBranding();
    const rgbHints={primary:'RGB 111 · 39 · 72',secondary:'RGB 154 · 79 · 109',accent:'RGB 199 · 154 · 82',canvas:'RGB 248 · 244 · 239'};
    openDrawer('색상·로고 설정',`<form id="visualBrandForm" class="visual-brand-form"><div class="visual-color-grid">${[['메인 컬러','primary'],['보조 컬러','secondary'],['강조 컬러','accent'],['배경 컬러','canvas']].map(([label,key])=>`<label><span>${label}</span><input type="color" name="${key}" value="${esc(brand[key])}"><small>${rgbHints[key]}</small></label>`).join('')}</div><label class="visual-upload"><span>상단 로고 · 브라우저 아이콘</span><input id="visualLogoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><small>${draftLogo?'현재 로고가 저장되어 있습니다. 새 파일을 선택하면 두 곳에 함께 변경됩니다.':'파일 하나를 올리면 페이지 상단과 브라우저 아이콘에 함께 적용됩니다.'}</small></label><div class="visual-inline-actions"><button class="secondary-btn" id="visualRemoveLogo" type="button">기본 로고로 초기화</button></div><button class="primary-btn visual-wide" type="submit">브랜드 변경 적용</button></form>`);
    document.getElementById('visualLogoFile').onchange=event=>fileData(event.target,value=>{draftLogo=value;showToast('상단 로고를 미리 저장했습니다.');});
    document.getElementById('visualRemoveLogo').onclick=()=>{draftLogo='';showToast('상단 로고와 브라우저 아이콘을 기본값으로 되돌렸습니다.');};
    document.getElementById('visualBrandForm').onsubmit=event=>{event.preventDefault();const fd=new FormData(event.currentTarget);content.branding={primary:fd.get('primary'),secondary:fd.get('secondary'),accent:fd.get('accent'),canvas:fd.get('canvas'),logo:draftLogo,favicon:draftLogo};setDirty();closeDrawer();reloadPreview();showToast('로고와 색상 변경을 미리보기에 적용했습니다.');};
  }

  function showHidden(){
    const hidden=Object.entries(content.overrides).filter(([,value])=>value==='');
    openDrawer('숨긴 문구',hidden.length?`<div class="visual-hidden-list">${hidden.map(([key])=>`<article><p>${esc(key)}</p><button class="secondary-btn" type="button" data-restore-hidden="${esc(key)}">다시 표시</button></article>`).join('')}</div>`:'<div class="visual-empty"><strong>숨긴 문구가 없습니다.</strong><p>문구 편집에서 ‘문구 숨기기’를 선택하면 이곳에서 다시 복원할 수 있습니다.</p></div>');
    document.querySelectorAll('[data-restore-hidden]').forEach(button=>button.onclick=()=>{delete content.overrides[button.dataset.restoreHidden];setDirty();showHidden();reloadPreview();});
  }

  async function saveAll(){
    const button=document.getElementById('visualSave');button.disabled=true;button.textContent='저장 중…';
    try{
      const data=await api('/api/site-content',{method:'PUT',body:JSON.stringify({version,content})});
      version=Number(data.version);content=data.content;localStorage.setItem(ADMIN_CONTENT_KEY,JSON.stringify(content.adminContent));localStorage.setItem(BRAND_KEY,JSON.stringify(content.branding));applyAdminContent(content.adminContent);applyBranding(content.branding);setDirty(false);button.textContent='변경사항 저장';reloadPreview();showToast('관리자 변경사항을 모든 사용자에게 반영했습니다.');
    }catch(error){button.disabled=false;button.textContent='변경사항 저장';if(error.status===401){location.reload();return;}if(error.status===409){showToast('다른 관리자가 먼저 저장했습니다. 페이지를 새로고침해 주세요.');return;}showToast('변경사항을 저장하지 못했습니다. 다시 시도해 주세요.');}
  }

  window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='tlc-visual-edit')return;showTextEditor(event.data.key);});
  window.addEventListener('beforeunload',event=>{if(!dirty)return;event.preventDefault();event.returnValue='';});
  window.renderAdminPageV2=renderVisualAdmin;
  window.renderVisualAdmin=renderVisualAdmin;
})();

</script>
<script>
/* ─────────────────────────────────────────────
 * 새로 더한 기능
 *  1) 관리자 화면의 "신청 목록" (링크 열기·복사·새로 발급, 삭제)
 *  2) 신청서의 개인정보 수집·이용 동의
 * ───────────────────────────────────────────── */
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var adminMode = params.get('admin') === '1';
  var previewMode = params.get('previewAdmin') === '1';

  function escHtml(v) {
    return String(v == null ? '' : v).replace(/[&<>'"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c];
    });
  }

  // ── 2) 개인정보 동의 ─────────────────────────
  function addConsent() {
    var form = document.getElementById('part1Form');
    if (!form || form.querySelector('[name="privacyConsent"]')) return;
    var actions = form.querySelector('.form-actions');
    if (!actions) return;
    actions.insertAdjacentHTML('beforebegin',
      '<div class="consent-box"><label class="consent-check">' +
      '<input type="checkbox" name="privacyConsent" value="동의" required>' +
      '<span><strong>개인정보 수집·이용에 동의합니다. <em>(필수)</em></strong>' +
      '<small>수집 목적: 주례 요청 확인과 결혼예식 준비\n' +
      '수집 항목: 신랑·신부 이름, 출석교회, 연락처, 희망 일정과 장소, 두 분의 이야기, 준비 화면에 적는 담당자 정보\n' +
      '보관 기간: 예식을 마친 뒤 교회 담당자가 프로젝트를 삭제할 때까지 보관합니다.\n' +
      '동의하지 않으실 수 있으며, 이 경우 온라인 신청이 어렵습니다. 교회 사무실로 문의해 주세요.</small></span>' +
      '</label></div>');
  }

  if (typeof render === 'function' && !previewMode) {
    var baseRender = render;
    render = function () {
      baseRender();
      addConsent();
    };
    addConsent();
  }

  // ── 1) 관리자 신청 목록 ───────────────────────
  if (!adminMode || previewMode) return;
  var server = window.weddingServer;
  var state = { projects: [], sheetUrl: '', query: '', showDemo: false, loading: false };

  var baseAdmin = window.renderAdminPageV2;
  window.renderAdminPageV2 = function () {
    var result = baseAdmin.apply(this, arguments);
    Promise.resolve(result).then(addListButton);
    return result;
  };
  renderAdminPageV2 = window.renderAdminPageV2;

  function addListButton() {
    var bar = document.querySelector('.visual-toolbar-actions');
    if (!bar || document.getElementById('projectListOpen')) return;
    bar.insertAdjacentHTML('afterbegin', '<button class="primary-btn project-list-open" id="projectListOpen" type="button">신청 목록</button>');
    document.getElementById('projectListOpen').onclick = openList;
    if (!document.getElementById('projectDrawer')) {
      document.body.insertAdjacentHTML('beforeend',
        '<aside class="visual-drawer project-drawer" id="projectDrawer" aria-label="신청 목록">' +
        '<div class="visual-drawer-head"><div><p class="eyebrow">PROJECTS</p><h2>신청 목록</h2></div>' +
        '<button class="visual-close" id="projectDrawerClose" type="button" aria-label="닫기">×</button></div>' +
        '<div id="projectDrawerBody"></div></aside>');
      document.getElementById('projectDrawerClose').onclick = function () {
        document.getElementById('projectDrawer').classList.remove('open');
      };
    }
  }

  function openList() {
    document.getElementById('visualDrawer') && document.getElementById('visualDrawer').classList.remove('open');
    document.getElementById('projectDrawer').classList.add('open');
    load();
  }

  function load() {
    var body = document.getElementById('projectDrawerBody');
    body.innerHTML = '<div class="visual-empty"><strong>신청 목록을 불러오는 중입니다…</strong></div>';
    server.call('adminProjects', server.adminToken()).then(function (d) {
      state.projects = d.projects || [];
      state.sheetUrl = d.sheetUrl || '';
      draw();
    }).catch(function (err) {
      if (err && err.status === 401) { location.reload(); return; }
      body.innerHTML = '<div class="visual-empty"><strong>신청 목록을 불러오지 못했습니다.</strong><p>' + escHtml(err && err.error) + '</p></div>';
    });
  }

  function dateLabel(iso) {
    var d = new Date(iso);
    if (!iso || isNaN(d.getTime())) return '';
    return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  }

  function draw() {
    var body = document.getElementById('projectDrawerBody');
    var q = state.query.trim().toLowerCase();
    var demoCount = state.projects.filter(function (p) { return p.kind === '예시'; }).length;
    var items = state.projects.filter(function (p) {
      if (!state.showDemo && p.kind === '예시') return false;
      if (!q) return true;
      return [p.groom, p.bride, p.id, p.venue, p.status].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    body.innerHTML =
      '<p class="project-list-help">신청서를 제출하면 이곳에 프로젝트가 생깁니다. 링크를 잃어버린 분께는 “링크 복사”로 다시 보내 드리세요.</p>' +
      '<div class="project-list-tools"><input type="search" id="projectSearch" placeholder="이름, 프로젝트 번호, 장소로 찾기" value="' + escHtml(state.query) + '">' +
      (demoCount ? '<label class="project-demo-toggle"><input type="checkbox" id="projectShowDemo"' + (state.showDemo ? ' checked' : '') + '> 예시 ' + demoCount + '건도 보기</label>' : '') +
      '<div class="project-list-links"><button class="secondary-btn" type="button" id="projectReload">새로고침</button>' +
      (state.sheetUrl ? '<a class="secondary-btn" href="' + escHtml(state.sheetUrl) + '" target="_blank" rel="noopener">시트 열기</a>' : '') + '</div></div>' +
      (items.length ? '<div class="project-list">' + items.map(card).join('') + '</div>'
        : '<div class="visual-empty"><strong>' + (state.projects.length ? '조건에 맞는 신청이 없습니다.' : '아직 들어온 신청이 없습니다.') + '</strong></div>');

    var search = document.getElementById('projectSearch');
    search.oninput = function () { state.query = search.value; var pos = search.selectionStart; draw(); var s = document.getElementById('projectSearch'); s.focus(); s.setSelectionRange(pos, pos); };
    var demo = document.getElementById('projectShowDemo');
    if (demo) demo.onchange = function () { state.showDemo = demo.checked; draw(); };
    document.getElementById('projectReload').onclick = load;
    body.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.onclick = function () { act(btn.getAttribute('data-act'), btn.getAttribute('data-id'), btn); };
    });
  }

  function card(p) {
    var names = (p.groom || '신랑 미입력') + ' · ' + (p.bride || '신부 미입력');
    var rows = [
      ['희망 일시 1', p.date1],
      ['확정 예식일', p.finalDate],
      ['결혼식 장소', p.venue],
      ['연락처', [p.groomPhone, p.bridePhone].filter(Boolean).join(' / ')],
      ['신청한 날', dateLabel(p.createdAt)],
      ['마지막 저장', dateLabel(p.updatedAt) + (p.lastSummary ? ' · ' + p.lastSummary : '')]
    ].filter(function (r) { return r[1]; });
    return '<article class="project-item">' +
      '<div class="project-item-head"><div><small>' + escHtml(p.id) + '</small><strong>' + escHtml(names) + '</strong></div>' +
      '<span class="project-badge' + (p.kind === '예시' ? ' is-demo' : '') + '">' + escHtml(p.kind === '예시' ? '예시' : (p.status || '진행 중')) + '</span></div>' +
      '<dl>' + rows.map(function (r) { return '<div><dt>' + r[0] + '</dt><dd>' + escHtml(r[1]) + '</dd></div>'; }).join('') + '</dl>' +
      '<div class="project-item-actions">' +
      '<button class="primary-btn" type="button" data-act="open" data-id="' + escHtml(p.id) + '">프로젝트 열기</button>' +
      '<button class="secondary-btn" type="button" data-act="copy" data-id="' + escHtml(p.id) + '">링크 복사</button>' +
      '<button class="secondary-btn" type="button" data-act="renew" data-id="' + escHtml(p.id) + '">새 링크 발급</button>' +
      '<button class="secondary-btn danger-text" type="button" data-act="delete" data-id="' + escHtml(p.id) + '">삭제</button>' +
      '</div></article>';
  }

  function act(kind, id, btn) {
    var p = state.projects.filter(function (x) { return x.id === id; })[0] || {};
    var names = (p.groom || '') + ' · ' + (p.bride || '');
    if (kind === 'delete') {
      if (!confirm('“' + names + '” 프로젝트를 삭제할까요?\n\n준비 화면의 모든 내용과 공유 링크가 함께 사라지고, 되돌릴 수 없습니다.')) return;
    }
    if (kind === 'renew') {
      if (!confirm('새 링크를 발급할까요?\n\n지금까지 나눠 드린 링크는 더 이상 열리지 않습니다. 새 링크를 다시 보내 주셔야 해요.')) return;
    }
    // 새 창은 클릭하자마자 열어 두어야 휴대폰 브라우저가 막지 않습니다
    var win = kind === 'open' ? window.open('', '_blank') : null;
    var label = btn.textContent;
    btn.disabled = true;
    btn.textContent = '처리 중…';
    var request = kind === 'delete'
      ? server.call('adminDeleteProject', server.adminToken(), id)
      : server.call('adminProjectLink', server.adminToken(), id, kind === 'renew');
    request.then(function (d) {
      btn.disabled = false;
      btn.textContent = label;
      if (kind === 'delete') {
        state.projects = state.projects.filter(function (x) { return x.id !== id; });
        draw();
        showToast('프로젝트를 삭제했습니다.');
        return;
      }
      var url = server.shareUrl(d.token);
      if (kind === 'open') {
        if (win) win.location.href = url; else window.open(url, '_blank');
        return;
      }
      copyText(url).then(function () {
        showToast(kind === 'renew' ? '새 링크를 발급하고 복사했습니다. 신랑·신부에게 다시 보내 주세요.' : '프로젝트 링크를 복사했습니다.');
      }, function () {
        prompt('아래 링크를 복사해 주세요.', url);
      });
    }).catch(function (err) {
      if (win) win.close();
      btn.disabled = false;
      btn.textContent = label;
      if (err && err.status === 401) { location.reload(); return; }
      showToast((err && err.error) || '처리하지 못했습니다.');
    });
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return Promise.reject();
  }
})();

</script>

</body>
